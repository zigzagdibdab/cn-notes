<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Computer Networks — Complete Study App</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#080c14;
  --surface:#0f1420;
  --card:#141c2e;
  --card2:#1a2238;
  --border:#1d2840;
  --border2:#253050;
  --accent:#00d4ff;
  --accent-dim:rgba(0,212,255,.12);
  --accent2:#7c3aed;
  --accent3:#10b981;
  --warn:#f59e0b;
  --danger:#ef4444;
  --text:#dde4f0;
  --muted:#4e6080;
  --muted2:#6b7fa0;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,.02) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}
*{position:relative;z-index:1}
h1,h2,h3,h4,h5{font-family:'Syne',sans-serif}
code,pre,.mono{font-family:'JetBrains Mono',monospace}

/* ── SIDEBAR ── */
#sidebar{position:fixed;left:0;top:0;height:100vh;width:255px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;z-index:200;transition:transform .28s cubic-bezier(.4,0,.2,1)}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sb-logo{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.sb-logo .eyebrow{font-size:.62rem;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-family:'Syne',sans-serif;margin-bottom:4px}
.sb-logo h2{font-size:.95rem;font-weight:700;color:#fff;line-height:1.3}
.sb-logo p{font-size:.7rem;color:var(--muted2);margin-top:3px}
.sb-prog{padding:10px 18px 14px;border-bottom:1px solid var(--border)}
.sb-prog-bar{height:2px;background:var(--border2);border-radius:1px;margin-top:6px}
.sb-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:1px;transition:width .4s}
.sb-prog-txt{font-size:.66rem;color:var(--muted);margin-top:4px}
.sb-unit{padding:8px 18px 2px;font-size:.58rem;color:var(--accent2);letter-spacing:.14em;text-transform:uppercase;font-family:'Syne',sans-serif;font-weight:700}
.sb-item{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;border-radius:0;border-left:2px solid transparent;font-size:.78rem;color:var(--muted2);transition:all .15s;background:none;border-right:none;border-top:none;border-bottom:none;width:100%;text-align:left;line-height:1.35}
.sb-item:hover{background:var(--card);color:var(--text)}
.sb-item.active{background:rgba(0,212,255,.06);border-left-color:var(--accent);color:var(--accent)}
.sb-item.done .sb-dot{background:var(--accent3)}
.sb-item.active .sb-dot{background:var(--accent)}
.sb-dot{width:5px;height:5px;border-radius:50%;background:var(--border2);flex-shrink:0;transition:background .2s}
.sb-divider{height:1px;background:var(--border);margin:8px 0}

/* ── MAIN ── */
#main{margin-left:255px;min-height:100vh}
#topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:100}
#topbar-title{font-size:.85rem;color:var(--muted2);font-family:'Syne',sans-serif;font-weight:600;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px}
.mode-tab{padding:5px 14px;border-radius:6px;border:none;background:none;color:var(--muted2);font-size:.74rem;cursor:pointer;transition:all .18s;font-family:'Syne',sans-serif;font-weight:600;letter-spacing:.02em}
.mode-tab:hover{color:var(--text)}
.mode-tab.active{background:var(--card2);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.4)}
#content{padding:36px 40px;max-width:860px}
.page{display:none}
.page.active{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── LEARN PAGE ── */
.topic-hero{margin-bottom:28px}
.topic-eyebrow{display:inline-block;padding:3px 10px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:20px;font-size:.65rem;color:var(--accent);margin-bottom:10px;font-family:'Syne',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.topic-hero h1{font-size:2rem;font-weight:800;line-height:1.2;color:#fff}
.topic-hero p{color:var(--muted2);margin-top:10px;font-size:.88rem;line-height:1.75}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:16px}
.scard h3{font-size:1rem;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px;font-weight:700}
.scard h3::before{content:'';display:block;width:3px;height:16px;background:var(--accent);border-radius:2px;flex-shrink:0}
.scard p,.scard li{line-height:1.8;color:#b8c8e0;font-size:.87rem}
.scard ul,.scard ol{padding-left:18px;margin-top:6px}
.scard li{margin-bottom:5px}
.scard strong{color:var(--text)}
.formula{background:#090d18;border:1px solid rgba(124,58,237,.35);border-radius:7px;padding:14px 18px;margin:12px 0;font-family:'JetBrains Mono',monospace;font-size:.82rem;color:#c4b5fd;line-height:1.85;white-space:pre-wrap}
.hl{background:rgba(16,185,129,.07);border-left:3px solid var(--accent3);padding:12px 16px;border-radius:0 7px 7px 0;margin:12px 0;font-size:.84rem;color:#a7f3d0;line-height:1.7}
.wl{background:rgba(245,158,11,.07);border-left:3px solid var(--warn);padding:12px 16px;border-radius:0 7px 7px 0;margin:12px 0;font-size:.84rem;color:#fde68a;line-height:1.7}
.kl{background:rgba(124,58,237,.08);border-left:3px solid var(--accent2);padding:12px 16px;border-radius:0 7px 7px 0;margin:12px 0;font-size:.84rem;color:#c4b5fd;line-height:1.7}
.tw{overflow-x:auto;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:.81rem}
th{background:rgba(0,212,255,.06);color:var(--accent);padding:9px 13px;text-align:left;border:1px solid var(--border);font-family:'Syne',sans-serif;font-size:.72rem;letter-spacing:.04em}
td{padding:9px 13px;border:1px solid var(--border);color:#b8c8e0;vertical-align:top;line-height:1.6}
tr:hover td{background:rgba(255,255,255,.015)}
.compare{display:grid;gap:10px;margin:12px 0}
.compare.c2{grid-template-columns:1fr 1fr}
.compare.c3{grid-template-columns:1fr 1fr 1fr}
.ccard{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:14px}
.ccard h4{color:var(--accent);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;font-family:'Syne',sans-serif}
.ccard ul{list-style:none;padding:0}
.ccard li{font-size:.8rem;color:var(--text);line-height:1.75;padding-left:14px;position:relative}
.ccard li::before{content:'→';position:absolute;left:0;color:var(--muted)}
.diagram{background:#06090f;border:1px solid var(--border);border-radius:8px;padding:20px;margin:14px 0}
.diagram pre{color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:.77rem;line-height:1.65;white-space:pre;overflow-x:auto}
.diagram-cap{color:var(--muted2);font-size:.7rem;text-align:center;margin-top:10px;font-style:italic}
.mark-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:6px;border:1px solid var(--accent3);background:transparent;color:var(--accent3);font-size:.72rem;cursor:pointer;transition:all .2s;margin-bottom:20px;font-family:'Inter',sans-serif}
.mark-btn:hover,.mark-btn.done{background:rgba(16,185,129,.1)}
.mark-btn.done{opacity:.6;cursor:default}
.topic-nav{display:flex;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--border)}
.tnav{padding:9px 18px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted2);font-size:.78rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;font-family:'Syne',sans-serif}
.tnav:hover{border-color:var(--accent);color:var(--accent)}
.tnav.nxt{margin-left:auto;background:rgba(0,212,255,.07);color:var(--accent);border-color:rgba(0,212,255,.25)}

/* ── Q&A PAGE ── */
.qa-item{border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.qa-q{padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--card);font-size:.87rem;font-weight:500;transition:background .15s;gap:12px}
.qa-q:hover{background:var(--card2)}
.qa-q-left{display:flex;align-items:flex-start;gap:10px}
.qa-num{color:var(--accent);font-family:'Syne',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.06em;margin-top:2px;flex-shrink:0}
.qa-arrow{transition:transform .25s;color:var(--muted);font-size:1rem;flex-shrink:0}
.qa-a{display:none;padding:14px 18px 16px;background:#0b0f1c;border-top:1px solid var(--border);font-size:.85rem;line-height:1.82;color:var(--muted2)}
.qa-a.open{display:block}
.qa-item.open .qa-arrow{transform:rotate(180deg)}

/* ── QUIZ PAGE ── */
.quiz-q-wrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:14px}
.qnum{font-size:.66rem;color:var(--accent);font-family:'Syne',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.qtext{font-size:.92rem;margin-bottom:14px;line-height:1.65;color:#fff}
.opts{display:grid;gap:7px}
.opt{padding:11px 15px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:.84rem;transition:all .18s;background:var(--surface);text-align:left;color:var(--text);display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent);background:rgba(0,212,255,.04)}
.opt.correct{border-color:var(--accent3)!important;background:rgba(16,185,129,.1)!important;color:#6ee7b7}
.opt.wrong{border-color:var(--danger)!important;background:rgba(239,68,68,.08)!important;color:#fca5a5}
.opt.show-correct{border-color:var(--accent3)!important;background:rgba(16,185,129,.04)!important}
.opt-lbl{width:20px;height:20px;border-radius:50%;border:1px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:.66rem;flex-shrink:0;font-family:'Syne',sans-serif}
.exp-box{margin-top:10px;padding:11px 14px;background:rgba(0,212,255,.04);border-radius:7px;font-size:.8rem;color:var(--muted2);display:none;line-height:1.7}
.exp-box.show{display:block}

/* ── ANKI FLASHCARDS ── */
.anki-header{margin-bottom:24px}
.anki-header h2{font-size:1.5rem;font-weight:800;color:#fff}
.anki-header p{color:var(--muted2);margin-top:5px;font-size:.85rem}
.anki-controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;align-items:center}
.filter-pill{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted2);font-size:.72rem;cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif}
.filter-pill:hover{border-color:var(--accent2);color:#c4b5fd}
.filter-pill.active{background:rgba(124,58,237,.15);border-color:var(--accent2);color:#c4b5fd}
.anki-stats{display:flex;gap:16px;margin-bottom:22px}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 18px;text-align:center}
.stat-num{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800}
.stat-num.green{color:var(--accent3)}
.stat-num.red{color:var(--danger)}
.stat-num.blue{color:var(--accent)}
.stat-lbl{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;font-family:'Syne',sans-serif}

/* The Anki card itself */
.anki-stage{position:relative;margin-bottom:20px}
.anki-progress{height:3px;background:var(--border);border-radius:2px;margin-bottom:16px}
.anki-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .35s}
.anki-card-wrap{perspective:1200px;height:260px;cursor:pointer;user-select:none}
.anki-card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.anki-card-wrap.flipped .anki-card-inner{transform:rotateY(180deg)}
.anki-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 32px;border:1px solid var(--border)}
.anki-front{background:var(--card)}
.anki-back{background:linear-gradient(135deg,#0d1628 0%,#120b24 100%);transform:rotateY(180deg);border-color:rgba(124,58,237,.3)}
.anki-card-tag{font-size:.6rem;color:var(--accent);font-family:'Syne',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;opacity:.8}
.anki-term{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;color:#fff;line-height:1.25}
.anki-hint{font-size:.72rem;color:var(--muted2);margin-top:12px;display:flex;align-items:center;gap:5px}
.anki-def{font-size:.9rem;line-height:1.75;color:#c4b5fd}
.anki-def strong{color:#e8dcff}
.anki-flip-indicator{position:absolute;top:14px;right:16px;font-size:.65rem;color:var(--muted);letter-spacing:.06em;font-family:'Syne',sans-serif;text-transform:uppercase}
.anki-front .anki-flip-indicator{color:var(--muted)}

/* Rating buttons — only show after flip */
.anki-ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:0;opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none}
.anki-ratings.visible{opacity:1;transform:translateY(0);pointer-events:all}
.rating-btn{padding:12px 6px;border-radius:8px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.rating-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.rating-btn .r-emoji{font-size:1.3rem}
.rating-btn .r-label{font-size:.65rem;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rating-btn .r-time{font-size:.6rem;color:var(--muted);margin-top:1px}
.rating-btn.again{border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.05)}
.rating-btn.again:hover{border-color:var(--danger);background:rgba(239,68,68,.1)}
.rating-btn.again .r-label{color:var(--danger)}
.rating-btn.hard{border-color:rgba(245,158,11,.25);background:rgba(245,158,11,.04)}
.rating-btn.hard:hover{border-color:var(--warn);background:rgba(245,158,11,.08)}
.rating-btn.hard .r-label{color:var(--warn)}
.rating-btn.good{border-color:rgba(0,212,255,.25);background:rgba(0,212,255,.04)}
.rating-btn.good:hover{border-color:var(--accent);background:rgba(0,212,255,.08)}
.rating-btn.good .r-label{color:var(--accent)}
.rating-btn.easy{border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.04)}
.rating-btn.easy:hover{border-color:var(--accent3);background:rgba(16,185,129,.08)}
.rating-btn.easy .r-label{color:var(--accent3)}

.anki-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.anki-counter{font-size:.78rem;color:var(--muted2);font-family:'Syne',sans-serif}
.anki-counter span{color:var(--accent);font-weight:700}
.anki-btn{padding:9px 20px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.8rem;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif;font-weight:600;display:flex;align-items:center;gap:6px}
.anki-btn:hover{border-color:var(--accent);color:var(--accent)}
.anki-btn.primary{background:rgba(0,212,255,.1);border-color:rgba(0,212,255,.3);color:var(--accent)}
.anki-btn:disabled{opacity:.3;cursor:not-allowed}
.anki-done{text-align:center;padding:48px 24px;background:var(--card);border:1px solid var(--border);border-radius:12px}
.anki-done h3{font-size:1.3rem;color:#fff;margin-bottom:8px}
.anki-done p{color:var(--muted2);font-size:.88rem;margin-bottom:24px}
.anki-done-scores{display:flex;justify-content:center;gap:24px;margin-bottom:28px}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:24px}
.deck-card{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:16px;cursor:pointer;transition:all .2s}
.deck-card:hover{border-color:var(--accent);background:var(--card2)}
.deck-card h4{font-family:'Syne',sans-serif;font-size:.9rem;color:#fff;margin-bottom:6px}
.deck-card .deck-count{font-size:.72rem;color:var(--muted2)}
.deck-card .deck-due{font-size:.7rem;color:var(--accent3);margin-top:4px}
.deck-card.selected{border-color:var(--accent);background:rgba(0,212,255,.06)}

/* Hamburger */
#hamburger{display:none;position:fixed;top:12px;left:12px;z-index:300;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;flex-direction:column;gap:4px}
#hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:1px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:190}
.overlay.show{display:block}
@media(max-width:768px){
  #sidebar{transform:translateX(-260px)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #content{padding:20px 16px}
  .topic-hero h1{font-size:1.5rem}
  #hamburger{display:flex}
  .compare.c2,.compare.c3{grid-template-columns:1fr}
  .anki-card-wrap{height:220px}
  .anki-ratings{grid-template-columns:repeat(2,1fr)}
  .mode-tab span.full{display:none}
}

/* Buttons */
.btn{padding:9px 22px;border-radius:8px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-size:.8rem;font-weight:700;transition:all .2s;letter-spacing:.03em}
.btn-primary{background:var(--accent);color:#000}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted2)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<button id="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
  <div class="sb-logo">
    <div class="eyebrow">Computer Networks</div>
    <h2>Complete Study Guide</h2>
    <p>Units I · II · III · IV</p>
  </div>
  <div class="sb-prog">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:.67rem;color:var(--muted2)">Progress</span>
      <span class="sb-prog-txt" id="sb-prog-txt">0 / 30 done</span>
    </div>
    <div class="sb-prog-bar"><div class="sb-prog-fill" id="sb-prog-fill" style="width:0%"></div></div>
  </div>
  <div id="sidebar-nav"></div>
</div>

<div id="main">
  <div id="topbar">
    <div id="topbar-title">Loading…</div>
    <div class="mode-tabs">
      <button class="mode-tab active" id="tab-learn" onclick="setMode('learn')">Learn</button>
      <button class="mode-tab" id="tab-qa" onclick="setMode('qa')">Q&amp;A</button>
      <button class="mode-tab" id="tab-quiz" onclick="setMode('quiz')">Quiz</button>
      <button class="mode-tab" id="tab-flash" onclick="setMode('flash')">Flashcards</button>
    </div>
  </div>
  <div id="content">
    <div id="page-learn" class="page active"></div>
    <div id="page-qa" class="page"></div>
    <div id="page-quiz" class="page"></div>
    <div id="page-flash" class="page"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const TOPICS = {
// ════ UNIT I — FOUNDATIONS ════
netypes:{unit:"Unit I — Foundations",title:"Network Types",tag:"Unit I · Foundations",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit I · Topic 01</div><h1>Network Types & Classifications</h1><p>Networks are classified by geographic scope, ownership, and communication model.</p></div>
<button class="mark-btn" onclick="markDone('netypes')">✓ Mark as done</button>
<div class="scard"><h3>LAN / MAN / WAN</h3><div class="compare c3"><div class="ccard"><h4>🏠 LAN</h4><ul><li>Local Area Network</li><li>Building / campus</li><li>Up to ~1 km</li><li>100 Mbps – 10 Gbps</li><li>Privately owned</li><li>e.g., Office, college lab</li></ul></div><div class="ccard"><h4>🏙️ MAN</h4><ul><li>Metropolitan Area Network</li><li>Covers a city/town</li><li>5–50 km</li><li>10–1000 Mbps</li><li>Cable TV, city Wi-Fi</li></ul></div><div class="ccard"><h4>🌍 WAN</h4><ul><li>Wide Area Network</li><li>Countries / continents</li><li>Unlimited range</li><li>Higher error rates</li><li>The Internet, ATM</li></ul></div></div></div>
<div class="scard"><h3>Broadcast vs Point-to-Point</h3><div class="compare c2"><div class="ccard"><h4>Broadcast</h4><ul><li>One node, all receive</li><li>Address field selects who acts</li><li>Old Ethernet bus, Wi-Fi</li><li>Analogy: TV broadcast</li></ul></div><div class="ccard"><h4>Point-to-Point</h4><ul><li>Dedicated link between 2 nodes</li><li>PPP, fiber trunk links</li><li>Analogy: phone call</li></ul></div></div></div>
<div class="kl">💡 Mental model: LAN = office building mail, MAN = city post, WAN = international postal service.</div>`,
qa:[{q:"A university campus (~500m) — LAN, MAN, or WAN?",a:"LAN. Local Area Networks cover buildings or campuses (up to ~1 km). A 500-meter campus is well within LAN range."},{q:"What is the difference between broadcast and point-to-point networks?",a:"Broadcast: one sender, all nodes receive and check the address field. Point-to-point: a dedicated link connects exactly two nodes. Modern switched Ethernet is point-to-point; Wi-Fi is still broadcast."},{q:"What is a PAN?",a:"Personal Area Network — covers a few metres around a person. Examples: Bluetooth (connecting phone to earbuds), USB, IrDA."}],
quiz:[{q:"A 500-metre university campus network is best classified as:",opts:["WAN","MAN","LAN","PAN"],ans:2,exp:"LAN covers buildings/campuses (≤1 km). 500 m is classic LAN territory."},{q:"The Internet is an example of:",opts:["LAN","MAN","WAN","PAN"],ans:2,exp:"The Internet is the largest WAN, spanning continents."},{q:"Bluetooth is an example of:",opts:["LAN","WAN","MAN","PAN"],ans:3,exp:"Bluetooth is a PAN (Personal Area Network) for short-range device connections."}],
flash:[{term:"LAN",def:"Local Area Network — covers a building or campus (≤1 km). High speed (100 Mbps–10 Gbps), privately owned.",tag:"Network Types"},{term:"MAN",def:"Metropolitan Area Network — city-scale, 5–50 km. Examples: cable TV, city Wi-Fi.",tag:"Network Types"},{term:"WAN",def:"Wide Area Network — spans countries/continents. Higher error rates, uses leased lines. Internet is the largest WAN.",tag:"Network Types"},{term:"PAN",def:"Personal Area Network — covers a few metres around a person. Example: Bluetooth.",tag:"Network Types"}]},

topologies:{unit:"Unit I — Foundations",title:"Network Topologies",tag:"Unit I · Foundations",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit I · Topic 02</div><h1>Network Topologies</h1><p>Topology is the geometric arrangement of nodes and links. Physical topology (actual wiring) vs logical topology (how data flows).</p></div>
<button class="mark-btn" onclick="markDone('topologies')">✓ Mark as done</button>
<div class="scard"><h3>Topology Diagram</h3><div class="diagram"><pre>BUS:   ─────●─────●─────●─────

STAR:          ●
               │
         ●─── ■ ───●      (■ = Hub/Switch)
               │
               ●

RING:  A ─── B
       │     │
       D ─── C

MESH:  A ────── B
       │╲      ╱│
       │ ╲    ╱ │
       D ────── C

TREE:      HQ
          /    \
        R1      R2
       / \     / \
      N1 N2  N3  N4</pre><div class="diagram-cap">Common network topologies</div></div></div>
<div class="scard"><h3>Comparison</h3><div class="tw"><table><tr><th>Topology</th><th>Advantages</th><th>Disadvantages</th><th>Example</th></tr><tr><td>Bus</td><td>Simple, cheap</td><td>Single backbone failure, collisions</td><td>Old 10BASE5</td></tr><tr><td>Star</td><td>Easy fault isolation, scalable</td><td>Hub/switch = single point of failure</td><td>Modern Ethernet</td></tr><tr><td>Ring</td><td>Equal access, predictable</td><td>Any break kills network</td><td>Token Ring, FDDI</td></tr><tr><td>Mesh</td><td>Fault tolerant, multiple paths</td><td>Expensive — many links</td><td>Internet core</td></tr><tr><td>Tree</td><td>Hierarchical, scalable</td><td>Root failure is catastrophic</td><td>Corporate WAN</td></tr></table></div></div>
<div class="formula">Full Mesh links = n(n-1) / 2   (n = number of nodes)</div>
<div class="hl">For 5 nodes: 5×4/2 = 10 links. For 6 nodes: 6×5/2 = 15 links.</div>`,
qa:[{q:"How many links in a full mesh with 6 nodes?",a:"n(n−1)/2 = 6×5/2 = 15 links. This is why full mesh is only used where maximum fault tolerance justifies the cost (e.g., Internet backbone)."},{q:"Why is Star topology dominant in modern LANs?",a:"A star with a switch gives each device its own full-duplex link, eliminating collisions. Fault isolation is easy — one cable failure affects only one device. Switches are cheap and fast."}],
quiz:[{q:"Full mesh with 6 nodes requires how many links?",opts:["12","15","20","36"],ans:1,exp:"n(n-1)/2 = 6×5/2 = 15."},{q:"Which topology has each device on its own collision domain?",opts:["Bus","Hub-based Star","Switch-based Star","Ring"],ans:2,exp:"A switch gives each port its own collision domain. Full-duplex means no collisions at all."}],
flash:[{term:"Full Mesh Formula",def:"Links = n(n-1)/2 where n = nodes. 6 nodes = 15 links. Expensive but maximally fault-tolerant.",tag:"Topologies"},{term:"Star Topology",def:"All nodes connect to a central hub/switch. Easy fault isolation, scalable. Hub/switch is single point of failure.",tag:"Topologies"},{term:"Bus Topology",def:"All nodes share one backbone cable. Simple and cheap, but backbone failure kills the network. Used in old 10BASE5.",tag:"Topologies"}]},

osi:{unit:"Unit I — Foundations",title:"OSI & TCP/IP Models",tag:"Unit I · Foundations",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit I · Topic 03</div><h1>OSI & TCP/IP Models</h1><p>Layering breaks a complex problem into manageable pieces. Each layer serves the one above and is served by the one below.</p></div>
<button class="mark-btn" onclick="markDone('osi')">✓ Mark as done</button>
<div class="scard"><h3>Side-by-Side Comparison</h3><div class="diagram"><pre>OSI (7 layers)              TCP/IP (4 layers)
──────────────────          ──────────────────────
7. APPLICATION              APPLICATION
6. PRESENTATION        ←──  (HTTP, DNS, SMTP, FTP)
5. SESSION
──────────────────          ──────────────────────
4. TRANSPORT           ←──  TRANSPORT (TCP, UDP)
──────────────────          ──────────────────────
3. NETWORK             ←──  INTERNET (IP, ICMP)
──────────────────          ──────────────────────
2. DATA LINK           ←──  NETWORK ACCESS
1. PHYSICAL                 (Ethernet, Wi-Fi)</pre></div></div>
<div class="wl">Mnemonic (top→bottom): <strong>All People Seem To Need Data Processing</strong><br>Application → Presentation → Session → Transport → Network → Data Link → Physical</div>
<div class="scard"><h3>Layer Functions & Protocols</h3><div class="tw"><table><tr><th>Layer</th><th>Function</th><th>Key Protocols/Devices</th></tr><tr><td>7 Application</td><td>User-facing services</td><td>HTTP, FTP, DNS, SMTP, POP3</td></tr><tr><td>6 Presentation</td><td>Format, encrypt, compress</td><td>SSL/TLS, JPEG, ASCII</td></tr><tr><td>5 Session</td><td>Manage sessions</td><td>NetBIOS, RPC</td></tr><tr><td>4 Transport</td><td>End-to-end delivery, ports</td><td>TCP, UDP</td></tr><tr><td>3 Network</td><td>Logical addressing, routing</td><td>IP, ICMP — Routers</td></tr><tr><td>2 Data Link</td><td>Framing, MAC, error detect</td><td>Ethernet, Wi-Fi — Switches</td></tr><tr><td>1 Physical</td><td>Bit transmission</td><td>Cables, Hubs, NIC</td></tr></table></div></div>
<div class="scard"><h3>Encapsulation</h3><div class="diagram"><pre>Application:  [ DATA ]
Transport:    [ TCP Hdr | DATA ]                ← Segment
Network:      [ IP Hdr | TCP Hdr | DATA ]       ← Packet
Data Link:    [ MAC Hdr | IP | TCP | DATA | FCS ] ← Frame
Physical:     101001010111000110...               ← Bits</pre></div></div>`,
qa:[{q:"What layer handles IP addresses and routing?",a:"Layer 3 — the Network Layer. It assigns logical (IP) addresses and makes routing decisions to move packets between different networks. Routers operate at this layer."},{q:"What is encapsulation?",a:"As data moves down the sender's protocol stack, each layer adds its own header (and sometimes trailer). Network layer adds IP header (Packet), Data Link adds MAC header+FCS (Frame), Physical converts to bits. The receiver strips headers going back up — called decapsulation."}],
quiz:[{q:"Which OSI layer handles logical addressing (IP) and routing?",opts:["Data Link","Transport","Network","Session"],ans:2,exp:"Layer 3 (Network) handles IP addresses and routing. Layer 2 (Data Link) handles MAC addresses."},{q:"At the Transport layer, the PDU is called a:",opts:["Frame","Packet","Segment","Bit"],ans:2,exp:"PDU names: Transport=Segment, Network=Packet, Data Link=Frame, Physical=Bits."},{q:"TCP/IP's 'Internet' layer corresponds to OSI's:",opts:["Transport","Network","Data Link","Session"],ans:1,exp:"TCP/IP's Internet layer = OSI's Network Layer (Layer 3). Both handle IP addressing and routing."}],
flash:[{term:"OSI Model",def:"7-layer reference model: Physical, Data Link, Network, Transport, Session, Presentation, Application. Mnemonic: Please Do Not Throw Sausage Pizza Away (bottom→top).",tag:"OSI"},{term:"Encapsulation",def:"Each layer adds its own header as data moves down the stack. Receiver strips headers going up — called decapsulation.",tag:"OSI"},{term:"Segment / Packet / Frame",def:"Transport PDU = Segment. Network PDU = Packet. Data Link PDU = Frame. Physical PDU = Bits.",tag:"OSI"},{term:"TCP/IP Model",def:"4-layer model: Network Access, Internet, Transport, Application. Maps to OSI but collapses Layers 5-7 into Application.",tag:"OSI"}]},

signals:{unit:"Unit I — Foundations",title:"Data & Signals",tag:"Unit I · Foundations",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit I · Topic 04</div><h1>Data & Signals</h1><p>Data is information; signals are the physical representation used to transmit it. Both can be analog or digital.</p></div>
<button class="mark-btn" onclick="markDone('signals')">✓ Mark as done</button>
<div class="scard"><h3>Signal Properties</h3><div class="tw"><table><tr><th>Property</th><th>Definition</th><th>Unit</th></tr><tr><td>Amplitude</td><td>Strength/height of wave</td><td>Volts</td></tr><tr><td>Frequency</td><td>Cycles per second</td><td>Hz</td></tr><tr><td>Period</td><td>Time for one cycle (T = 1/f)</td><td>Seconds</td></tr><tr><td>Phase</td><td>Position relative to reference</td><td>Degrees</td></tr><tr><td>Bandwidth</td><td>Range of frequencies in signal</td><td>Hz</td></tr><tr><td>Bit Rate</td><td>Bits transmitted per second</td><td>bps</td></tr></table></div></div>
<div class="scard"><h3>Nyquist & Shannon — Theoretical Limits</h3>
<p>These define the maximum data rate achievable on a channel.</p>
<p><strong>Nyquist (noiseless channel):</strong></p>
<div class="formula">Max Bit Rate = 2 × B × log₂(L)
B = bandwidth (Hz), L = number of signal levels</div>
<p><strong>Shannon (noisy channel):</strong></p>
<div class="formula">Channel Capacity = B × log₂(1 + SNR)
SNR = Signal-to-Noise Ratio</div></div>
<div class="hl">Example: B=3000 Hz, L=8 → Nyquist = 2 × 3000 × log₂(8) = 6000 × 3 = <strong>18,000 bps</strong></div>
<div class="wl">⚠️ Shannon gives the theoretical maximum. Real systems always operate below it. Nyquist is limited by signal levels; Shannon by noise.</div>`,
qa:[{q:"Noiseless channel: BW=3000 Hz, 8 levels. Max bit rate?",a:"Nyquist: 2 × B × log₂(L) = 2 × 3000 × log₂(8) = 2 × 3000 × 3 = 18,000 bps."},{q:"What does Shannon's theorem tell us?",a:"Shannon's theorem gives the theoretical maximum capacity of a noisy channel: C = B × log₂(1 + SNR). It is an absolute upper limit — no encoding can exceed it regardless of number of signal levels."}],
quiz:[{q:"Nyquist max bit rate with B=3000 Hz, 8 levels?",opts:["6000 bps","9000 bps","18000 bps","24000 bps"],ans:2,exp:"2 × 3000 × log₂(8) = 2 × 3000 × 3 = 18,000 bps."},{q:"Shannon's capacity formula uses:",opts:["Frequency and levels","Bandwidth and SNR","Amplitude and phase","Wavelength and period"],ans:1,exp:"Shannon: C = B × log₂(1 + SNR). It accounts for noise unlike Nyquist."}],
flash:[{term:"Nyquist Theorem",def:"Max Bit Rate = 2 × B × log₂(L). For noiseless channels. L = signal levels, B = bandwidth.",tag:"Signals"},{term:"Shannon Capacity",def:"C = B × log₂(1 + SNR). Theoretical max for noisy channel. Absolute ceiling — no encoding can exceed it.",tag:"Signals"},{term:"Bandwidth (Hz)",def:"Range of frequencies in a signal. Wider bandwidth → higher possible data rate.",tag:"Signals"},{term:"SNR",def:"Signal-to-Noise Ratio — ratio of signal power to noise power. Higher SNR → higher Shannon capacity.",tag:"Signals"}]},

transmission:{unit:"Unit I — Foundations",title:"Digital & Analog Transmission",tag:"Unit I · Foundations",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit I · Topic 05</div><h1>Digital & Analog Transmission</h1><p>Converting data to signals and vice versa — line coding, modulation, and PCM.</p></div>
<button class="mark-btn" onclick="markDone('transmission')">✓ Mark as done</button>
<div class="scard"><h3>Line Coding — Digital to Digital</h3><div class="tw"><table><tr><th>Scheme</th><th>How it works</th><th>Sync</th><th>Used in</th></tr><tr><td>NRZ-L</td><td>High=1, Low=0</td><td>Poor</td><td>RS-232</td></tr><tr><td>NRZ-I</td><td>Invert on 1, same on 0</td><td>Better</td><td>USB</td></tr><tr><td>Manchester</td><td>Low→High=1, High→Low=0 at midbit</td><td>Excellent</td><td>10BASE-T</td></tr><tr><td>4B/5B</td><td>Map 4-bit → 5-bit codeword</td><td>Good</td><td>Fast Ethernet</td></tr><tr><td>AMI</td><td>0=0V, 1 alternates +/-V</td><td>Moderate</td><td>T1/E1</td></tr></table></div></div>
<div class="scard"><h3>Modulation — Digital to Analog</h3><div class="compare c3"><div class="ccard"><h4>ASK</h4><ul><li>Vary amplitude</li><li>Simple, noise-sensitive</li><li>Optical fiber (on/off)</li></ul></div><div class="ccard"><h4>FSK</h4><ul><li>Vary frequency</li><li>Less noise-sensitive</li><li>Old modems, radio</li></ul></div><div class="ccard"><h4>PSK/QAM</h4><ul><li>Vary phase (+ amplitude for QAM)</li><li>64-QAM: 6 bits/symbol</li><li>Wi-Fi, LTE, cable</li></ul></div></div>
<div class="formula">Bits per symbol = log₂(M)   M = number of signal states</div></div>
<div class="scard"><h3>PCM — Analog to Digital</h3><div class="compare c3"><div class="ccard"><h4>1. Sample</h4><ul><li>Nyquist: ≥ 2 × max freq</li><li>Voice: 8000 samples/sec</li></ul></div><div class="ccard"><h4>2. Quantize</h4><ul><li>Round to nearest level</li><li>256 levels = 8 bits</li></ul></div><div class="ccard"><h4>3. Encode</h4><ul><li>8 bits × 8000 = 64 Kbps</li><li>CD: 44100 × 16 = 705 Kbps</li></ul></div></div></div>`,
qa:[{q:"Why does Manchester encoding have excellent clock synchronization?",a:"Manchester always has a transition at the mid-point of every bit period (Low→High for 1, High→Low for 0). This constant transition gives the receiver a timing signal, making synchronization easy and eliminating long runs of 0s or 1s."},{q:"What is 64-QAM and how many bits per symbol?",a:"64-QAM (Quadrature Amplitude Modulation) combines amplitude and phase variations, creating 64 distinct signal states. Bits per symbol = log₂(64) = 6. Used in Wi-Fi 5, 4G LTE, cable modems for high throughput."}],
quiz:[{q:"64-QAM carries how many bits per symbol?",opts:["4","6","8","16"],ans:1,exp:"Bits/symbol = log₂(M) = log₂(64) = 6."},{q:"Telephone voice (4 kHz bandwidth) is digitized using PCM at:",opts:["4000 bps","8000 samples/sec","16000 samples/sec","64 kHz"],ans:1,exp:"Nyquist: sample at ≥ 2 × 4000 = 8000 samples/sec. With 8 bits/sample → 64 Kbps (standard PSTN voice)."}],
flash:[{term:"Manchester Encoding",def:"Mid-bit transition encodes data: Low→High=1, High→Low=0. Excellent clock sync. Used in 10BASE-T Ethernet.",tag:"Transmission"},{term:"QAM",def:"Quadrature Amplitude Modulation — varies both amplitude and phase. 64-QAM = 6 bits/symbol. Used in Wi-Fi, LTE.",tag:"Transmission"},{term:"PCM",def:"Pulse Code Modulation — digitizes analog signal: Sample (8000/s) → Quantize (256 levels) → Encode (8 bits). Result: 64 Kbps for voice.",tag:"Transmission"},{term:"4B/5B",def:"Block coding: maps every 4-bit block to a 5-bit codeword, ensuring no long runs of 0s. Used in Fast Ethernet (100BASE-TX).",tag:"Transmission"}]},

multiplexing:{unit:"Unit I — Foundations",title:"Multiplexing",tag:"Unit I · Foundations",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit I · Topic 06</div><h1>Bandwidth Utilization & Multiplexing</h1><p>Multiplexing allows multiple signals to share a single transmission medium simultaneously.</p></div>
<button class="mark-btn" onclick="markDone('multiplexing')">✓ Mark as done</button>
<div class="kl">💡 Analogy: A highway with multiple lanes. Each car (signal) uses its own lane (channel) without collision.</div>
<div class="scard"><h3>Multiplexing Techniques</h3><div class="tw"><table><tr><th>Type</th><th>Divides by</th><th>Used for</th><th>Example</th></tr><tr><td><strong>FDM</strong></td><td>Frequency band</td><td>Analog, broadband</td><td>FM/AM radio, cable TV, ADSL</td></tr><tr><td><strong>TDM</strong></td><td>Time slot (fixed)</td><td>Digital, telephone</td><td>T1/E1, SONET</td></tr><tr><td><strong>STDM</strong></td><td>Time slot (demand)</td><td>Variable traffic</td><td>Internet packets</td></tr><tr><td><strong>WDM</strong></td><td>Wavelength of light</td><td>Fiber optic</td><td>DWDM (Dense WDM)</td></tr><tr><td><strong>CDM</strong></td><td>Unique code</td><td>Wireless / cellular</td><td>CDMA (3G), GPS</td></tr></table></div></div>
<div class="scard"><h3>TDM Frame Structure</h3><div class="diagram"><pre>Frame:  [A₁][B₁][C₁][D₁] [A₂][B₂][C₂][D₂] ...

T1: 24 channels × 8 bits × 8000 frames/sec = 1.544 Mbps
E1: 32 channels × 8 bits × 8000 frames/sec = 2.048 Mbps</pre></div></div>`,
qa:[{q:"What is the difference between FDM and TDM?",a:"FDM (Frequency Division Multiplexing) divides the channel into frequency bands — each signal gets its own band and all transmit simultaneously (used for cable TV, radio). TDM (Time Division Multiplexing) divides the channel into time slots — each signal gets a rotating slot in a frame (used for T1/E1, telephone networks)."},{q:"How does DWDM work?",a:"Dense Wavelength Division Multiplexing is FDM applied to fiber optics. Each signal uses a different wavelength (colour) of light. Modern DWDM systems carry 80–160 channels on a single fiber, each at 100 Gbps, for terabits of total capacity."}],
quiz:[{q:"Cable TV uses which multiplexing technique?",opts:["TDM","FDM","CDM","WDM"],ans:1,exp:"FDM: each TV channel occupies its own frequency band on the coaxial cable. All channels are transmitted simultaneously."},{q:"T1 line total bit rate?",opts:["1.0 Mbps","1.544 Mbps","2.048 Mbps","45 Mbps"],ans:1,exp:"24 channels × 8 bits × 8000 frames/sec = 1.544 Mbps."}],
flash:[{term:"FDM",def:"Frequency Division Multiplexing — each signal gets a unique frequency band. All transmit simultaneously. Used in cable TV, radio.",tag:"Multiplexing"},{term:"TDM",def:"Time Division Multiplexing — each signal gets a fixed time slot in a repeating frame. Used in T1/E1, SONET.",tag:"Multiplexing"},{term:"WDM / DWDM",def:"Wavelength Division Multiplexing — FDM for fiber; each channel uses a different wavelength of light. DWDM: 80+ channels per fiber.",tag:"Multiplexing"},{term:"T1 Line",def:"24 channels, 8 bits each, 8000 frames/sec = 1.544 Mbps. Standard North American digital voice carrier.",tag:"Multiplexing"}]},

switching:{unit:"Unit I — Foundations",title:"Switching",tag:"Unit I · Foundations",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit I · Topic 07</div><h1>Switching Techniques</h1><p>Switching routes data through intermediate nodes on shared infrastructure — avoiding the cost of direct links between every pair.</p></div>
<button class="mark-btn" onclick="markDone('switching')">✓ Mark as done</button>
<div class="scard"><h3>Three Paradigms</h3><div class="compare c3"><div class="ccard"><h4>📞 Circuit Switching</h4><ul><li>Dedicated path before transfer</li><li>3 phases: Setup → Transfer → Teardown</li><li>Guaranteed bandwidth</li><li>Wastes if idle (reserved)</li><li>Example: PSTN telephone</li></ul></div><div class="ccard"><h4>📬 Message Switching</h4><ul><li>Entire message stored then forwarded</li><li>No dedicated path</li><li>Messages can be queued</li><li>Better utilization than circuit</li><li>Analogy: Email, telegrams</li></ul></div><div class="ccard"><h4>📦 Packet Switching</h4><ul><li>Message split into packets</li><li>Each routed independently</li><li>May arrive out of order</li><li>Best link utilization</li><li>Example: Internet (IP)</li></ul></div></div></div>
<div class="scard"><h3>Comparison Table</h3><div class="tw"><table><tr><th>Feature</th><th>Circuit</th><th>Message</th><th>Packet</th></tr><tr><td>Setup required</td><td>Yes</td><td>No</td><td>No</td></tr><tr><td>Dedicated path</td><td>Yes</td><td>No</td><td>No</td></tr><tr><td>Store-and-forward</td><td>No</td><td>Yes (full)</td><td>Yes (per packet)</td></tr><tr><td>Bandwidth efficiency</td><td>Poor</td><td>Better</td><td>Best</td></tr><tr><td>Ordering</td><td>Guaranteed</td><td>Guaranteed</td><td>No (datagrams)</td></tr><tr><td>Real-time</td><td>Excellent</td><td>Poor</td><td>Good (with QoS)</td></tr></table></div></div>
<div class="kl">💡 Packet switching: Datagram (each packet independent, no order guarantee — Internet) vs Virtual Circuit (path established first, same path — ATM, MPLS).</div>`,
qa:[{q:"Why does the Internet use packet switching instead of circuit switching?",a:"Packet switching is far more efficient for bursty data traffic. With circuit switching, reserved bandwidth sits idle during pauses. Packet switching shares the link among many users — statistical multiplexing gives higher utilization. It's also more resilient: if a router fails, packets can be rerouted."},{q:"What is a virtual circuit?",a:"A virtual circuit (VC) is a packet-switching approach that establishes a path before data transfer (like circuit switching) but uses stored-and-forwarded packets (like datagram). All packets follow the same path. Used in ATM and MPLS. More predictable than pure datagrams but less flexible."}],
quiz:[{q:"PSTN telephone uses:",opts:["Packet switching","Circuit switching","Message switching","Virtual circuit"],ans:1,exp:"PSTN uses circuit switching — a dedicated end-to-end path is reserved for the duration of each call."},{q:"In datagram packet switching, packets arriving at the destination:",opts:["Always in order","May be out of order","Are acknowledged per packet","Follow a fixed path"],ans:1,exp:"Datagram packets are independently routed and may take different paths, arriving out of order."}],
flash:[{term:"Circuit Switching",def:"Dedicated path reserved before data transfer. Fixed bandwidth guaranteed. Used in PSTN. Inefficient if channel is idle.",tag:"Switching"},{term:"Packet Switching",def:"Data split into packets, each independently routed. Efficient (statistical multiplexing). Internet standard.",tag:"Switching"},{term:"Virtual Circuit",def:"Hybrid — establish path first (like circuit), carry packets (like datagram). Used in ATM, MPLS. Predictable latency.",tag:"Switching"},{term:"Store-and-Forward",def:"Node receives entire frame/packet before forwarding it. Introduces processing delay. Used in switches and routers.",tag:"Switching"}]},

// ════ UNIT II — DATA LINK & TRANSPORT ════
dll:{unit:"Unit II — Data Link & Transport",title:"Data Link Layer",tag:"Unit II · Data Link",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit II · Topic 01</div><h1>Data Link Layer</h1><p>The DLL provides node-to-node delivery. Two sub-layers: LLC (error/flow control) and MAC (medium access, addressing).</p></div>
<button class="mark-btn" onclick="markDone('dll')">✓ Mark as done</button>
<div class="scard"><h3>DLL Functions</h3><div class="tw"><table><tr><th>Function</th><th>Description</th></tr><tr><td>Framing</td><td>Divide bitstream into frames with headers/trailers</td></tr><tr><td>Error Detection</td><td>Detect corrupted frames (CRC, checksum, parity)</td></tr><tr><td>Error Correction</td><td>Retransmit or correct errors (ARQ, Hamming)</td></tr><tr><td>Flow Control</td><td>Prevent fast sender overwhelming slow receiver</td></tr><tr><td>MAC</td><td>Manage access to shared medium</td></tr></table></div></div>
<div class="scard"><h3>Error Detection</h3><div class="compare c3"><div class="ccard"><h4>Parity</h4><ul><li>Add bit → even or odd parity</li><li>Detects single-bit errors</li><li>Misses 2-bit errors</li><li>Simple, minimal overhead</li></ul></div><div class="ccard"><h4>CRC</h4><ul><li>Polynomial division of data</li><li>Remainder appended as FCS</li><li>Very powerful — detects burst errors</li><li>Used in Ethernet, Wi-Fi</li></ul></div><div class="ccard"><h4>Checksum</h4><ul><li>Sum all data segments</li><li>Append 1's complement</li><li>Used in IP, TCP, UDP headers</li></ul></div></div></div>
<div class="wl">⚠️ Error detection only DETECTS. Correction requires ARQ (retransmit) or FEC (forward error correction, e.g., Hamming codes).</div>`,
qa:[{q:"What is CRC and how does it work?",a:"CRC (Cyclic Redundancy Check) treats data as a polynomial, divides it by a generator polynomial, and appends the remainder (FCS = Frame Check Sequence) to the frame. The receiver performs the same division — if the remainder is zero, no error. CRC detects all burst errors shorter than the degree of the generator polynomial."},{q:"What is the difference between error detection and error correction?",a:"Error detection (parity, CRC, checksum) tells the receiver that an error occurred, but not which bits are wrong — it requests retransmission (ARQ). Error correction (Hamming codes, Reed-Solomon) uses redundant bits to identify and fix specific corrupt bits without retransmission (FEC — Forward Error Correction)."}],
quiz:[{q:"CRC is based on:",opts:["Polynomial division","Hamming distance","XOR of all bytes","Binary addition"],ans:0,exp:"CRC performs polynomial division of the frame data by a generator polynomial, appending the remainder as the FCS."},{q:"Which error detection method is used in Ethernet frames?",opts:["Parity","Checksum","CRC","Hamming"],ans:2,exp:"Ethernet uses 32-bit CRC (CRC-32) as the Frame Check Sequence (FCS) in the trailer."}],
flash:[{term:"CRC",def:"Cyclic Redundancy Check — polynomial division to generate Frame Check Sequence. Detects all burst errors < degree of generator polynomial.",tag:"Data Link"},{term:"FCS",def:"Frame Check Sequence — error detection field (CRC) appended to frame trailer. Receiver recalculates and compares.",tag:"Data Link"},{term:"ARQ",def:"Automatic Repeat Request — error correction by retransmission. Three types: Stop-and-Wait, Go-Back-N, Selective Repeat.",tag:"Data Link"},{term:"MAC Sublayer",def:"Lower sublayer of DLL. Controls access to shared medium, manages MAC addresses (48-bit hardware addresses).",tag:"Data Link"}]},

mac:{unit:"Unit II — Data Link & Transport",title:"Multiple Access Protocols",tag:"Unit II · Data Link",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit II · Topic 02</div><h1>Multiple Access Protocols</h1><p>When multiple devices share a medium, collisions occur. These protocols coordinate access.</p></div>
<button class="mark-btn" onclick="markDone('mac')">✓ Mark as done</button>
<div class="scard"><h3>Evolution: ALOHA → CSMA/CD</h3><div class="tw"><table><tr><th>Protocol</th><th>How it works</th><th>Max Efficiency</th></tr><tr><td>Pure ALOHA</td><td>Send anytime. Collision? Random backoff, resend.</td><td>18.4%</td></tr><tr><td>Slotted ALOHA</td><td>Send only at start of time slots.</td><td>36.8%</td></tr><tr><td>CSMA</td><td>Sense medium first. If idle, send. Still possible collisions.</td><td>Better</td></tr><tr><td>CSMA/CD</td><td>Sense + transmit. Detect collision → jam → exponential backoff. Wired only.</td><td>High</td></tr><tr><td>CSMA/CA</td><td>Sense + random backoff even if idle. RTS/CTS for hidden node. Wireless.</td><td>Good</td></tr></table></div></div>
<div class="scard"><h3>Binary Exponential Backoff (CSMA/CD)</h3><div class="diagram"><pre>After kth collision: wait random [0, 2^k - 1] slots
k=1:  wait 0 or 1 slots
k=2:  wait 0,1,2, or 3 slots
k=10: wait 0–1023 slots (capped)
After 16 failures → abort, report error</pre></div>
<div class="hl">Minimum Ethernet frame = 64 bytes. Ensures a collision is detected before transmission ends.</div></div>
<div class="scard"><h3>Hidden Node Problem (Wireless)</h3><p>A and C are both in range of B, but not each other. A doesn't know C is transmitting → both send to B → collision at B.</p><p><strong>Solution:</strong> RTS/CTS handshake. A sends RTS → B replies CTS (heard by both A and C) → C defers.</p></div>`,
qa:[{q:"Why does Wi-Fi use CSMA/CA instead of CSMA/CD?",a:"In wireless networks, a transmitting node's own signal drowns out any received signal — it cannot detect a collision while transmitting (the hidden node problem also means it may not even hear the other transmitter). CSMA/CA avoids collisions proactively using random backoff and optional RTS/CTS, rather than detecting them reactively."},{q:"What is the count-to-infinity problem? (Related to DV routing but also relevant)",a:"In Distance Vector routing, when a link fails, routers keep incrementing the failed route's metric (counting up toward infinity) because they see each other's stale routes. The solution includes split horizon (don't advertise a route back on the interface you learned it) and poison reverse (advertise the route with metric = infinity)."}],
quiz:[{q:"Why can't wireless nodes use CSMA/CD?",opts:["Too slow","Can't detect collision while transmitting","License restrictions","Requires cables"],ans:1,exp:"A wireless node's own transmission overwhelms any received signal — it cannot simultaneously transmit and detect collisions."},{q:"Minimum Ethernet frame size is 64 bytes because:",opts:["MTU requirement","Ensures collision detection before end of transmission","Header overhead","Switch buffer size"],ans:1,exp:"If the frame is shorter, a collision could occur after transmission ends, going undetected. 64 bytes ensures CD works on max-length segments."}],
flash:[{term:"CSMA/CD",def:"Carrier Sense Multiple Access / Collision Detection. Sense, transmit, detect collision → jam → binary exponential backoff. Wired Ethernet.",tag:"MAC Protocols"},{term:"CSMA/CA",def:"Carrier Sense Multiple Access / Collision Avoidance. Random backoff + RTS/CTS. Used in Wi-Fi (can't detect collisions wirelessly).",tag:"MAC Protocols"},{term:"Hidden Node Problem",def:"Node A and C can't hear each other but both reach B. A transmits not knowing C is transmitting → collision at B. Solved by RTS/CTS.",tag:"MAC Protocols"},{term:"Binary Exponential Backoff",def:"After kth collision, wait random [0, 2^k − 1] slots. Caps at k=10 (0–1023). Abort after 16 collisions.",tag:"MAC Protocols"},{term:"Slotted ALOHA",def:"Nodes transmit only at slot boundaries. Halves collision window vs Pure ALOHA. Max efficiency = 36.8% (1/e).",tag:"MAC Protocols"}]},

ethernet:{unit:"Unit II — Data Link & Transport",title:"Ethernet & Wireless LANs",tag:"Unit II · Data Link",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit II · Topic 03</div><h1>Ethernet & Wireless LANs</h1><p>Ethernet (IEEE 802.3) dominates wired LANs. Wi-Fi (IEEE 802.11) dominates wireless LANs.</p></div>
<button class="mark-btn" onclick="markDone('ethernet')">✓ Mark as done</button>
<div class="scard"><h3>Ethernet Frame Structure</h3><div class="diagram"><pre>┌──────────┬─────┬──────────┬─────────┬──────────────────┬─────┐
│ Preamble │ SFD │ Dest MAC │ Src MAC │ Type/Length 2B   │ FCS │
│  7 bytes │ 1B  │  6 bytes │ 6 bytes │ DATA 46–1500 B   │ 4B  │
└──────────┴─────┴──────────┴─────────┴──────────────────┴─────┘
Min frame: 64 bytes | Max frame: 1518 bytes
Preamble: 10101010... (clock sync)
SFD: 10101011 (marks start)
FCS: 32-bit CRC</pre></div></div>
<div class="scard"><h3>Ethernet Speed Standards</h3><div class="tw"><table><tr><th>Standard</th><th>Speed</th><th>Medium</th><th>Name</th></tr><tr><td>10BASE-T</td><td>10 Mbps</td><td>Cat 3 UTP</td><td>Legacy Ethernet</td></tr><tr><td>100BASE-TX</td><td>100 Mbps</td><td>Cat 5 UTP</td><td>Fast Ethernet</td></tr><tr><td>1000BASE-T</td><td>1 Gbps</td><td>Cat 5e UTP</td><td>Gigabit Ethernet</td></tr><tr><td>10GBASE-T</td><td>10 Gbps</td><td>Cat 6a UTP</td><td>10G Ethernet</td></tr></table></div>
<div class="hl">Naming: <strong>XBase-Y</strong> = X Mbps, baseband, Y = medium. XBase-T = twisted pair.</div></div>
<div class="scard"><h3>IEEE 802.11 Wi-Fi Standards</h3><div class="tw"><table><tr><th>Standard</th><th>Wi-Fi</th><th>Max Speed</th><th>Freq</th></tr><tr><td>802.11b</td><td>Wi-Fi 1</td><td>11 Mbps</td><td>2.4 GHz</td></tr><tr><td>802.11g</td><td>Wi-Fi 3</td><td>54 Mbps</td><td>2.4 GHz</td></tr><tr><td>802.11n</td><td>Wi-Fi 4</td><td>600 Mbps</td><td>2.4/5 GHz, MIMO</td></tr><tr><td>802.11ac</td><td>Wi-Fi 5</td><td>3.5 Gbps</td><td>5 GHz, MU-MIMO</td></tr><tr><td>802.11ax</td><td>Wi-Fi 6</td><td>9.6 Gbps</td><td>2.4/5/6 GHz, OFDMA</td></tr></table></div></div>
<div class="scard"><h3>Devices: Hub vs Bridge vs Switch vs Router</h3><div class="tw"><table><tr><th>Device</th><th>Layer</th><th>Collision Domain</th><th>Broadcast Domain</th></tr><tr><td>Hub</td><td>L1</td><td>One per hub</td><td>One per hub</td></tr><tr><td>Bridge/Switch</td><td>L2</td><td>One per port</td><td>One per device</td></tr><tr><td>Router</td><td>L3</td><td>One per interface</td><td>One per interface</td></tr></table></div></div>`,
qa:[{q:"What is the purpose of the Preamble in an Ethernet frame?",a:"The 7-byte preamble (10101010 pattern) allows the receiving NIC to synchronize its clock with the sender's bit rate. The SFD (Start Frame Delimiter, 10101011) then signals the actual frame is beginning."},{q:"How does a switch differ from a hub?",a:"A hub is a Layer 1 repeater — it broadcasts every received bit to all ports (one collision domain). A switch is a Layer 2 device with a MAC address table — it forwards frames only to the correct destination port (separate collision domain per port). With switches, full-duplex is possible and CSMA/CD is obsolete in practice."}],
quiz:[{q:"Ethernet frame minimum size is 64 bytes because:",opts:["Header overhead","MTU standard","Enables collision detection","Historical convention"],ans:2,exp:"64-byte minimum ensures a collision during transmission is detectable before the frame finishes sending."},{q:"A switch separates:",opts:["Broadcast domains","Collision domains","Both","Neither"],ans:1,exp:"A switch creates separate collision domains per port. To separate broadcast domains, you need a router (or VLANs)."}],
flash:[{term:"Ethernet Frame",def:"Preamble(7) + SFD(1) + Dest MAC(6) + Src MAC(6) + Type/Length(2) + Data(46-1500) + FCS(4). Min 64B, Max 1518B.",tag:"Ethernet"},{term:"Switch",def:"Layer 2 device with MAC address table. Forwards frames to correct port only. Separate collision domain per port.",tag:"Ethernet"},{term:"802.11ax (Wi-Fi 6)",def:"Up to 9.6 Gbps, 2.4/5/6 GHz, uses OFDMA for better multi-user performance. Improved efficiency in dense environments.",tag:"Wireless"},{term:"MIMO",def:"Multiple Input Multiple Output — uses multiple antennas to transmit simultaneously. Wi-Fi 4 (802.11n) introduced it. MU-MIMO allows multiple clients simultaneously.",tag:"Wireless"}]},

arq:{unit:"Unit II — Data Link & Transport",title:"ARQ Protocols",tag:"Unit II · Transport",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit II · Topic 04</div><h1>ARQ Protocols</h1><p>Automatic Repeat Request protocols provide reliable data transfer over unreliable channels using ACKs and retransmissions.</p></div>
<button class="mark-btn" onclick="markDone('arq')">✓ Mark as done</button>
<div class="scard"><h3>Stop-and-Wait</h3><p>Send one frame. Wait for ACK. Timeout → retransmit.</p><div class="formula">Efficiency η = 1 / (1 + 2a)
a = Propagation delay / Transmission time</div>
<div class="wl">⚠️ Very inefficient over high-latency links. If a=10, efficiency = 1/21 ≈ 5%!</div></div>
<div class="scard"><h3>Sliding Window Protocols</h3><p>Send W frames before waiting for ACKs.</p><div class="formula">η = W / (1 + 2a)  if W &lt; 1+2a
η = 1             if W ≥ 1+2a  (full utilization)</div></div>
<div class="scard"><h3>Go-Back-N vs Selective Repeat</h3><div class="tw"><table><tr><th>Feature</th><th>Go-Back-N</th><th>Selective Repeat</th></tr><tr><td>Window size</td><td>≤ 2ⁿ⁻¹</td><td>≤ 2ⁿ⁻¹ (both sender + receiver)</td></tr><tr><td>On error</td><td>Retransmit from error onward</td><td>Retransmit only the errored frame</td></tr><tr><td>Receiver buffering</td><td>None (discard out-of-order)</td><td>Yes (buffer out-of-order)</td></tr><tr><td>Efficiency</td><td>Wastes BW on error</td><td>Higher efficiency</td></tr><tr><td>Complexity</td><td>Simpler receiver</td><td>More complex</td></tr></table></div></div>`,
qa:[{q:"GBN with 4-bit sequence numbers — max window size?",a:"Go-Back-N window size = 2ⁿ − 1 = 2⁴ − 1 = 15. One slot reserved to distinguish full from empty window."},{q:"Why is Selective Repeat more efficient than Go-Back-N?",a:"In GBN, when one frame is lost, the sender retransmits that frame AND all subsequent frames — wasting bandwidth. SR only retransmits the specific lost frame; the receiver buffers correctly-received out-of-order frames. SR wastes far less bandwidth when error rates are high."}],
quiz:[{q:"GBN with 4-bit sequence numbers — max sender window?",opts:["16","15","8","7"],ans:1,exp:"GBN max window = 2ⁿ − 1 = 2⁴ − 1 = 15."},{q:"In Stop-and-Wait with a=50, efficiency is approximately:",opts:["50%","2%","1%","25%"],ans:2,exp:"η = 1/(1+2×50) = 1/101 ≈ 1%. Terrible efficiency for high-latency links."},{q:"Selective Repeat requires buffering at:",opts:["Sender only","Receiver only","Both sender and receiver","Neither"],ans:2,exp:"SR: Sender buffers unACKed frames; Receiver buffers out-of-order frames."}],
flash:[{term:"Stop-and-Wait",def:"Send one frame, wait for ACK. η = 1/(1+2a). Inefficient over high-latency links.",tag:"ARQ"},{term:"Go-Back-N",def:"Window ≤ 2ⁿ⁻¹. Error → retransmit from error onward. No receiver buffering. Simpler but wastes BW.",tag:"ARQ"},{term:"Selective Repeat",def:"Window ≤ 2ⁿ⁻¹. Error → retransmit only that frame. Receiver buffers out-of-order. Efficient.",tag:"ARQ"},{term:"Sliding Window Efficiency",def:"η = W/(1+2a) if W < 1+2a, else η = 1. W = window size, a = prop delay / tx time.",tag:"ARQ"}]},

tcpudp:{unit:"Unit II — Data Link & Transport",title:"UDP & TCP",tag:"Unit II · Transport",
learn:`<div class="topic-hero"><div class="topic-eyebrow">Unit II · Topic 05</div><h1>UDP & TCP</h1><p>The transport layer provides process-to-process delivery using port numbers. UDP is fast and simple; TCP is reliable.</p></div>
<button class="mark-btn" onclick="markDone('tcpudp')">✓ Mark as done</button>
<div class="scard"><h3>UDP vs TCP</h3><div class="compare c2"><div class="ccard"><h4>UDP</h4><ul><li>Connectionless — no setup</li><li>Unreliable — no ACKs</li><li>No flow / congestion control</li><li>8-byte header only</li><li>Fast and low overhead</li><li>DNS, VoIP, streaming, gaming, DHCP</li></ul></div><div class="ccard"><h4>TCP</h4><ul><li>Connection-oriented (3-way handshake)</li><li>Reliable — ACKs + retransmit</li><li>Flow control (rwnd)</li><li>Congestion control (AIMD)</li><li>In-order delivery</li><li>HTTP, FTP, SSH, email</li></ul></div></div></div>
<div class="scard"><h3>TCP 3-Way Handshake</h3><div class="diagram"><pre>Client                     Server
  │── SYN (seq=x) ──────────▶│  "I want to connect, seq=x"
  │◀── SYN+ACK (seq=y,ack=x+1)│  "OK, my seq=y, expecting x+1"
  │── ACK (ack=y+1) ─────────▶│  "Got it, expecting y+1"
  │══════ DATA TRANSFER ══════│
  │── FIN ────────────────────▶│  \
  │◀── ACK ───────────────────│   } 4-way teardown
  │◀── FIN ───────────────────│   }
  │── ACK ────────────────────▶│  /</pre></div></div>
<div class="scard"><h3>TCP Flow & Congestion Control</h3><div class="compare c2"><div class="ccard"><h4>Flow Control</h4><ul><li>Receiver advertises rwnd</li><li>Sender ≤ rwnd bytes unACKed</li><li>Prevents overwhelming receiver</li></ul></div><div class="ccard"><h4>Congestion Control (AIMD)</h4><ul><li>Slow Start: cwnd doubles/RTT</li><li>Congestion Avoidance: linear+</li><li>Loss → halve threshold, reset cwnd</li></ul></div></div>
<div class="formula">Effective send rate = min(rwnd, cwnd)</div></div>`,
qa:[{q:"What is the TCP 3-way handshake?",a:"SYN (client→server): 'I want to connect, my seq=x'. SYN+ACK (server→client): 'OK, my seq=y, I expect x+1'. ACK (client→server): 'Got it, I expect y+1'. This establishes the connection and synchronizes sequence numbers."},{q:"Why does TCP use sequence numbers?",a:"Sequence numbers (32-bit) number each byte in the data stream. They enable: (1) ACK — confirm which bytes received, (2) reordering — reassemble out-of-order segments, (3) duplicate detection — discard duplicates, (4) flow control — track outstanding bytes."},{q:"What is AIMD and why does it work?",a:"Additive Increase Multiplicative Decrease — TCP increases cwnd by 1 MSS/RTT on success (slowly exploring capacity), but halves it on packet loss (aggressive retreat). This converges to fair sharing of bottleneck bandwidth between competing flows."}],
quiz:[{q:"UDP is preferred over TCP for live video streaming because:",opts:["TCP is insecure","UDP has lower latency — drops acceptable","UDP has higher throughput","TCP doesn't support multicast"],ans:1,exp:"Live streaming needs low latency. A dropped frame is better than waiting for TCP's retransmission, which would cause stuttering."},{q:"The TCP 3-way handshake establishes:",opts:["IP routing path","Session keys","Synchronized sequence numbers + connection","ACK window"],ans:2,exp:"3-way handshake synchronizes sequence numbers (ISNs) and establishes the connection state before data transfer."},{q:"TCP effective send rate is limited by:",opts:["rwnd only","cwnd only","min(rwnd, cwnd)","max(rwnd, cwnd)"],ans:2,exp:"TCP respects both flow control (rwnd from receiver) and congestion control (cwnd determined by network). The binding constraint is min(rwnd, cwnd)."}],
flash:[{term:"TCP 3-Way Handshake",def:"SYN → SYN+ACK → ACK. Synchronizes sequence numbers and establishes connection before data transfer.",tag:"TCP/UDP"},{term:"rwnd",def:"Receiver Window — advertised by TCP receiver to limit how much unACKed data sender can have. Flow control.",tag:"TCP/UDP"},{term:"cwnd",def:"Congestion Window — TCP sender's self-imposed limit based on network congestion signals. Part of AIMD.",tag:"TCP/UDP"},{term:"AIMD",def:"Additive Increase Multiplicative Decrease — TCP congestion control. Linear growth, multiplicative halving on loss. Converges to fair share.",tag:"TCP/UDP"},{term:"UDP Header",def:"Only 8 bytes: Source Port, Dest Port, Length, Checksum. No connection, no ACK, no ordering. Fast and minimal.",tag:"TCP/UDP"}]},
