<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Computer Networks — Complete Course (Units I - IV)</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500&family=Fraunces:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #0a0d14;
  --surface: #111520;
  --surface2: #1a2234;
  --card: #161c2d;
  --border: #1e2740;
  --accent: #00d4ff;
  --accent2: #7c3aed;
  --accent3: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --text: #e2e8f0;
  --muted: #64748b;
  --radius: 12px;
  --mono: 'JetBrains Mono', monospace;
  --serif: 'Fraunces', serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Grid noise texture from HTML 2 */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: 
    linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

h1, h2, h3, h4 { font-family: 'Syne', sans-serif; }
code, pre { font-family: var(--mono); }

/* SIDEBAR */
#sidebar {
  position: fixed; left: 0; top: 0; height: 100vh; width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto; z-index: 100;
  transition: transform .3s;
}
#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.sb-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
.sb-header h2 { font-size: 1.1rem; color: var(--accent); letter-spacing: .05em; font-family: var(--serif); font-weight: 700; }
.sb-header p { font-size: .75rem; color: var(--muted); margin-top: 4px; }

.progress-bar-wrap {
  margin: 16px 20px 0; background: var(--border); border-radius: 2px; height: 4px;
}
.progress-bar-fill {
  height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.4s ease; width: 0%;
}
.progress-text { padding: 8px 20px 12px; font-size: .7rem; color: var(--muted); }

.sb-section {
  padding: 12px 20px 8px; font-size: .65rem; color: var(--accent3);
  letter-spacing: .1em; text-transform: uppercase; margin-top: 8px; font-weight: 700;
}
.sb-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 20px;
  cursor: pointer; transition: all .2s; border: none; background: none;
  width: 100%; text-align: left; font-size: .82rem; color: var(--muted);
  border-left: 2px solid transparent;
}
.sb-item:hover { background: var(--surface2); color: var(--text); }
.sb-item.active { background: rgba(0,212,255,.08); color: var(--accent); border-left-color: var(--accent); }
.sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex-shrink: 0; transition: background .2s;}
.sb-item.done .sb-dot { background: var(--accent3); }
.sb-item.active .sb-dot { background: var(--accent); }

/* MAIN */
#main { margin-left: 280px; min-height: 100vh; position: relative; z-index: 1; }
#topbar {
  height: 60px; background: rgba(17, 21, 32, 0.9); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 32px; position: sticky; top: 0; z-index: 50;
}
#topbar h1 { font-size: 1rem; color: var(--text); }
.mode-btns { display: flex; gap: 6px; }
.mode-btn {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: none; color: var(--muted); font-size: .78rem; cursor: pointer;
  transition: all .2s; font-family: 'Syne', sans-serif;
}
.mode-btn:hover { border-color: var(--accent); color: var(--accent); }
.mode-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
#content { padding: 40px; max-width: 900px; }

/* PAGES */
.page { display: none; animation: fadeIn 0.3s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* LEARN CONTENT COMPONENTS (Merged from both HTMLs) */
.topic-header { margin-bottom: 32px; }
.topic-tag {
  display: inline-block; padding: 3px 10px; background: rgba(0,212,255,.1);
  border: 1px solid rgba(0,212,255,.3); border-radius: 20px; font-size: .72rem;
  color: var(--accent); margin-bottom: 12px; font-family: 'Syne', sans-serif; letter-spacing: .05em;
}
.topic-header h1 { font-size: 2.2rem; font-weight: 800; line-height: 1.2; }
.topic-header p { color: var(--muted); margin-top: 12px; font-size: .95rem; line-height: 1.7; }

.section-card, .concept-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 28px; margin-bottom: 20px; position: relative;
}
.concept-box::before {
  content: attr(data-label); position: absolute; top: -10px; left: 16px;
  background: var(--bg); padding: 0 8px; font-size: 10px; color: var(--accent);
  letter-spacing: 2px; text-transform: uppercase; font-family: 'Syne', sans-serif;
}
.section-card h3, .concept-box h3 {
  font-size: 1.1rem; color: var(--accent); margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.section-card h3::before { content: ''; display: block; width: 3px; height: 18px; background: var(--accent); border-radius: 2px; }
.section-card p, .concept-box p, .section-card li { line-height: 1.8; color: #cbd5e1; font-size: .9rem; margin-bottom: 10px;}
.section-card ul, .concept-box ul { padding-left: 20px; margin-top: 8px; margin-bottom: 12px;}
.section-card li, .concept-box li { margin-bottom: 6px; }

.formula-box, .formula {
  background: rgba(124,58,237,.1); border: 1px solid var(--accent2);
  border-radius: 8px; padding: 16px; margin: 14px 0; font-family: var(--mono);
  font-size: .88rem; color: #c4b5fd; line-height: 1.8; text-align: center; letter-spacing: 1px;
}
.highlight-box, .highlight {
  background: rgba(16,185,129,.08); border-left: 3px solid var(--accent3);
  padding: 14px 18px; border-radius: 0 8px 8px 0; margin: 14px 0; font-size: .88rem; color: #a7f3d0; line-height: 1.7;
}
.warn-box, .highlight.warn {
  background: rgba(245,158,11,.08); border-left: 3px solid var(--warn);
  padding: 14px 18px; border-radius: 0 8px 8px 0; margin: 14px 0; font-size: .88rem; color: #fde68a;
}

.compare-grid { display: grid; gap: 12px; margin: 16px 0; }
.compare-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.compare-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.compare-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.compare-card h4 { color: var(--accent); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
.compare-card ul { list-style: none; padding-left: 0; }
.compare-card ul li { color: var(--text); font-size: 13px; line-height: 1.8; padding-left: 14px; position: relative; }
.compare-card ul li::before { content: '→'; position: absolute; left: 0; color: var(--muted); }

.diagram { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; margin: 20px 0; overflow-x: auto;}
.diagram pre { color: var(--accent); font-size: 12px; line-height: 1.6; }
.diagram-caption { color: var(--muted); font-size: 11px; text-align: center; margin-top: 12px; font-style: italic; }

.table-wrap { overflow-x: auto; margin: 14px 0; border-radius: 8px; border: 1px solid var(--border);}
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
th { background: var(--surface2); color: var(--accent); padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); font-family: 'Syne', sans-serif; text-transform: uppercase; font-size: .75rem;}
td { padding: 12px 14px; border-bottom: 1px solid var(--border); color: #cbd5e1; vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(0,212,255,.03); }

/* Q&A */
.qa-list { margin-top: 8px; }
.qa-item { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
.qa-q { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: var(--card); font-size: .9rem; font-weight: 500; transition: background .2s; }
.qa-q:hover { background: #1a2136; }
.qa-q span:first-child { color: var(--accent); margin-right: 10px; font-family: 'Syne', sans-serif; font-size: .8rem; }
.qa-arrow { transition: transform .3s; color: var(--muted); font-size: 1.1rem; }
.qa-a { display: none; padding: 16px 20px; background: #0f1520; border-top: 1px solid var(--border); font-size: .88rem; line-height: 1.8; color: #94a3b8; }
.qa-a.open { display: block; }
.qa-item.open .qa-arrow { transform: rotate(180deg); }

/* QUIZ */
.quiz-header { margin-bottom: 28px; }
.quiz-header h2 { font-size: 1.5rem; font-weight: 700; }
.quiz-header p { color: var(--muted); margin-top: 6px; }
.quiz-q { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 16px; }
.quiz-q .qnum { font-size: .72rem; color: var(--accent); font-family: 'Syne', sans-serif; letter-spacing: .1em; margin-bottom: 8px; }
.quiz-q .qtext { font-size: 1rem; margin-bottom: 16px; line-height: 1.6; font-family: var(--serif); color: #fff;}
.options { display: grid; gap: 8px; }
.opt { padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: .88rem; transition: all .2s; background: var(--surface); text-align: left; color: var(--text); display: flex; align-items: center; gap: 10px; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: rgba(0,212,255,.05); }
.opt.correct { border-color: var(--accent3) !important; background: rgba(16,185,129,.1) !important; color: #6ee7b7; }
.opt.wrong { border-color: var(--danger) !important; background: rgba(239,68,68,.1) !important; color: #fca5a5; }
.opt.reveal-correct { border-color: var(--accent3) !important; background: rgba(16,185,129,.05) !important; }
.opt-label { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--muted); display: flex; align-items: center; justify-content: center; font-size: .72rem; flex-shrink: 0; font-family: 'Syne', sans-serif; }
.explanation { margin-top: 12px; padding: 12px 16px; background: rgba(0,212,255,.05); border-radius: 8px; font-size: .84rem; color: #94a3b8; display: none; border: 1px solid rgba(0,212,255,.2);}
.explanation.show { display: block; }

/* FLASHCARDS */
.fc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.fc { perspective: 1000px; height: 180px; cursor: pointer; border-radius: var(--radius); outline: none; transition: transform 0.2s;}
/* Keyboard Accessibility Styling */
.fc:focus { outline: 2px solid var(--accent); outline-offset: 4px; transform: scale(1.02); }
.fc-inner { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; }
.fc.flipped .fc-inner { transform: rotateY(180deg); }
.fc-front, .fc-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 1px solid var(--border); }
.fc-front { background: var(--card); }
.fc-back { background: linear-gradient(135deg, #0f1f3d, #1a0a2e); transform: rotateY(180deg); border-color: var(--accent2); }
.fc-front .term { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; color: var(--accent); }
.fc-front .hint { font-size: .72rem; color: var(--muted); margin-top: 8px; }
.fc-back .def { font-size: .82rem; line-height: 1.6; color: #c4b5fd; }
.fc-tag { font-size: .65rem; color: var(--accent2); font-family: 'Syne', sans-serif; letter-spacing: .1em; margin-bottom: 8px; text-transform: uppercase; }
.fc-controls { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
.filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--muted); font-size: .75rem; cursor: pointer; transition: all .2s; }
.filter-btn.active { background: rgba(124,58,237,.2); border-color: var(--accent2); color: #c4b5fd; }

/* NAV ARROWS */
.topic-nav { display: flex; justify-content: space-between; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); }
.tnav-btn { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: .82rem; cursor: pointer; transition: all .2s; font-family: var(--mono); }
.tnav-btn:hover { border-color: var(--accent); color: var(--accent); }
.tnav-btn.primary { background: rgba(0,212,255,.1); color: var(--accent); border-color: rgba(0,212,255,.3); font-weight: 700; }
.tnav-btn.primary:hover { background: rgba(0,212,255,.2); }
.mark-btn { background: transparent; border: 1px solid var(--accent3); color: var(--accent3); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: var(--mono); font-size: 11px; margin-bottom: 24px; transition: all 0.2s; }
.mark-btn:hover { background: rgba(16,185,129,0.1); }
.mark-btn.marked { background: rgba(16,185,129,0.15); border-color: transparent; cursor: default; }

/* RESPONSIVE */
@media(max-width:768px){
  #sidebar { transform: translateX(-280px); }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left: 0; }
  #content { padding: 20px; }
  .topic-header h1 { font-size: 1.6rem; }
  #hamburger { display: flex !important; }
  .compare-grid.cols-3, .compare-grid.cols-2 { grid-template-columns: 1fr; }
}
#hamburger { display: none; position: fixed; top: 14px; left: 14px; z-index: 200; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; flex-direction: column; gap: 4px; }
#hamburger span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; }
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 90; }
.overlay.show { display: block; }
</style>
</head>

const TOPICS = {
// --- UNIT 1 ---
u1_basics: {
  title: "Overview & Topologies",
  tag: "UNIT I · Foundations",
  learn: `
<div class="topic-header">
  <div class="topic-tag">UNIT I · Foundations</div>
  <h1>Network Types & Topologies</h1>
  <p>Understanding the fundamental classifications and physical layouts of computer networks.</p>
</div>
<button class="mark-btn" id="mark-u1_basics" onclick="markDone('u1_basics')">✓ Mark as read</button>

<div class="concept-box" data-label="DEFINITION">
  <h3>What is a Computer Network?</h3>
  <p>A <strong style="color:var(--accent)">computer network</strong> is a collection of interconnected devices that can share resources and communicate. Networks are classified by <em>geographic scope</em>, <em>transmission medium</em>, and <em>communication mode</em>.</p>
</div>
<div class="compare-grid cols-3">
  <div class="compare-card">
    <h4>🏠 LAN</h4>
    <ul><li>Local Area Network</li><li>Single building / campus</li><li>Up to ~1 km</li><li>High speed (Gbps)</li><li>Privately owned</li></ul>
  </div>
  <div class="compare-card">
    <h4>🏙️ MAN</h4>
    <ul><li>Metropolitan Area Network</li><li>Covers a city/town</li><li>Range: 5–50 km</li><li>Medium speed</li><li>Public or private</li></ul>
  </div>
  <div class="compare-card">
    <h4>🌍 WAN</h4>
    <ul><li>Wide Area Network</li><li>Countries/continents</li><li>Unlimited range</li><li>Lower speed</li><li>Public/leased lines</li></ul>
  </div>
</div>

<div class="concept-box" data-label="TOPOLOGIES">
  <h3>Network Topologies</h3>
  <p>A <strong style="color:var(--accent)">topology</strong> is the geometric arrangement of nodes and links. It affects cost, scalability, and fault tolerance.</p>
  <div class="diagram">
    <pre>
BUS:       ─────●─────●─────●─────●─────
STAR:               ●─── A
                         │
                    B ───■ HUB/SW ─── C
RING:          A ─── B
               │     │
               D ─── C
MESH (Full):   Links = n(n-1)/2
    </pre>
  </div>
  <div class="table-wrap"><table>
    <tr><th>Topology</th><th>Pros</th><th>Cons</th></tr>
    <tr><td><strong>Bus</strong></td><td>Cheap, easy to add nodes</td><td>Single point of failure (backbone), collisions</td></tr>

  <h3>Automatic Repeat Request (ARQ)</h3>
  <p>Ensures reliable delivery using ACKs and timeouts.</p>

    <li><strong>Stop-and-Wait:</strong> Send 1 frame, wait for ACK. Very inefficient over long distances.</li>
    <li><strong>Go-Back-N (GBN):</strong> Send multiple frames (window size W). If frame N is lost, retransmit N and ALL subsequent frames. Max window = 2ⁿ - 1.</li>
    <li><strong>Selective Repeat (SR):</strong> Retransmit ONLY the lost frame. Requires buffers at receiver. Max window = 2ⁿ⁻¹.</li>
  </ul>
</div>

<div class="concept-box" data-label="TCP/UDP">

  <div class="table-wrap"><table>

const TOPIC_ORDER = ['u1_basics','u1_models','u1_physical','u1_switching','u2_dll_wired','u2_dll_wireless','u2_transport','netintro','ipv4','ipv6','applayer','multimedia','netmgmt','security'];

let currentTopic = 'u1_basics';
let currentMode = 'learn';
let quizState = {};
let activeFilter = 'all';
let doneTopics = new Set();
const TOTAL_TOPICS = TOPIC_ORDER.length;

function loadTopic(id){
  currentTopic = id;
  document.querySelectorAll('.sb-item').forEach(b => b.classList.remove('active'));
  const idx = TOPIC_ORDER.indexOf(id);
  const btns = document.querySelectorAll('.sb-item:not([onclick="showFlashcards()"])');
  if(btns[idx]) btns[idx].classList.add('active');
  
  document.getElementById('topbar-title').textContent = TOPICS[id].title;
  setMode(currentMode);
  
  // Mobile sidebar closure
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function setMode(mode){
  currentMode = mode;
  ['learn','qa','quiz','flash'].forEach(m => {
    document.getElementById('page-'+m).classList.remove('active');
    document.getElementById('btn-'+m).classList.remove('active');
  });
  document.getElementById('page-'+mode).classList.add('active');
  document.getElementById('btn-'+mode).classList.add('active');
  
  const t = TOPICS[currentTopic];
  if(mode==='learn') renderLearn(t);
  if(mode==='qa') renderQA(t);
  if(mode==='quiz') renderQuiz(t);
  if(mode==='flash') renderFlash(t.flash, false);

  updateMarkBtnState();
}

function renderLearn(t){
  const idx = TOPIC_ORDER.indexOf(currentTopic);
  const prev = TOPIC_ORDER[idx-1];
  const next = TOPIC_ORDER[idx+1];
  let nav = '<div class="topic-nav">';
  if(prev) nav += `<button class="tnav-btn" onclick="loadTopic('${prev}')">← ${TOPICS[prev].title}</button>`;
  if(next) nav += `<button class="tnav-btn primary" onclick="loadTopic('${next}')">${TOPICS[next].title} →</button>`;
  nav += '</div>';
  document.getElementById('page-learn').innerHTML = t.learn + nav;
  updateMarkBtnState();
}

function renderQA(t){
  let html = `<div class="topic-header"><div class="topic-tag">${t.tag}</div><h1>Q&A</h1></div><div class="qa-list">`;
  if(!t.qa || t.qa.length===0) html += `<p style="color:var(--muted)">No Q&A items available for this topic.</p>`;
  else {
    t.qa.forEach((qa,i)=>{
      html += `<div class="qa-item" id="qa-${i}">
        <div class="qa-q" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' ') toggleQA(${i})" onclick="toggleQA(${i})">
          <div><span>Q${i+1}.</span>${qa.q}</div>
          <span class="qa-arrow">▼</span>
        </div>
        <div class="qa-a" id="qa-a-${i}">${qa.a}</div>
      </div>`;
    });
  }
  html += '</div>';
  document.getElementById('page-qa').innerHTML = html;
}

function toggleQA(i){
  document.getElementById('qa-'+i).classList.toggle('open');
  document.getElementById('qa-a-'+i).classList.toggle('open');
}

function renderQuiz(t){
  quizState = {answers:{}, submitted:{}};
  let html = `<div class="quiz-header"><h2>Quiz</h2><p>Select an answer to check instantly.</p></div>`;
  if(!t.quiz || t.quiz.length===0) html += `<p style="color:var(--muted)">No Quiz available for this topic.</p>`;
  else {
    t.quiz.forEach((q,i)=>{
      const labels = ['A','B','C','D'];
      let opts = q.opts.map((o,j)=>`
        <button class="opt" id="opt-${i}-${j}" onclick="selectOpt(${i},${j})">
          <span class="opt-label">${labels[j]}</span>${o}
        </button>`).join('');
      html += `<div class="quiz-q">
        <div class="qnum">QUESTION ${i+1}</div>
        <div class="qtext">${q.q}</div>
        <div class="options" id="opts-${i}">${opts}</div>
        <div class="explanation" id="exp-${i}">💡 ${q.exp}</div>
      </div>`;
    });
  }
  document.getElementById('page-quiz').innerHTML = html;
}

function selectOpt(qi,oi){
  if(quizState.submitted[qi]) return;
  quizState.submitted[qi] = true;
  const t = TOPICS[currentTopic];
  const correct = t.quiz[qi].ans;
  const opts = document.getElementById('opts-'+qi).querySelectorAll('.opt');
  opts.forEach((o,j)=>{
    o.disabled = true;
    if(j===correct) o.classList.add(oi===correct ? 'correct' : 'reveal-correct');
    if(j===oi && oi!==correct) o.classList.add('wrong');
  });
  document.getElementById('exp-'+qi).classList.add('show');
}

function showFlashcards(){
  currentMode = 'flash';
  ['learn','qa','quiz','flash'].forEach(m=>{
    document.getElementById('page-'+m).classList.remove('active');
    document.getElementById('btn-'+m).classList.remove('active');
  });
  document.getElementById('page-flash').classList.add('active');
  document.getElementById('btn-flash').classList.add('active');
  
  let allCards = [];
  TOPIC_ORDER.forEach(id=>{ if(TOPICS[id].flash) allCards = allCards.concat(TOPICS[id].flash); });
  renderFlash(allCards, true);
}

function renderFlash(cards, showFilter){
  const tags = [...new Set(cards.map(c=>c.tag))];
  let filtered = activeFilter==='all' ? cards : cards.filter(c=>c.tag===activeFilter);
  
  let html = '<div class="topic-header"><h1>Flashcards</h1><p>Use <strong>Tab</strong> to navigate, <strong>Space/Enter</strong> to flip, and <strong>Arrow Keys</strong> to move between cards.</p></div>';
  
  if(showFilter){
    html += '<div class="fc-controls">';
    html += `<button class="filter-btn ${activeFilter==='all'?'active':''}" onclick="filterFlash('all')">All (${cards.length})</button>`;
    tags.forEach(tag=>{
      const cnt = cards.filter(c=>c.tag===tag).length;
      html += `<button class="filter-btn ${activeFilter===tag?'active':''}" onclick="filterFlash('${tag}')">${tag} (${cnt})</button>`;
    });
    html += '</div>';
  }
  
  html += '<div class="fc-grid">';
  if(filtered.length === 0) html += '<p style="color:var(--muted)">No flashcards available.</p>';
  filtered.forEach((c,i)=>{
    html += `<div class="fc" id="fc-${i}" tabindex="0" onclick="flipCard(${i})" onkeydown="handleFcKey(event, ${i}, ${filtered.length})">
      <div class="fc-inner">
        <div class="fc-front">
          <div class="fc-tag">${c.tag}</div>
          <div class="term">${c.term}</div>
          <div class="hint">Flip →</div>
        </div>
        <div class="fc-back">
          <div class="fc-tag">${c.term}</div>
          <div class="def">${c.def}</div>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('page-flash').innerHTML = html;
}

function filterFlash(tag){
  activeFilter = tag;
  let allCards = [];
  TOPIC_ORDER.forEach(id=>{ if(TOPICS[id].flash) allCards = allCards.concat(TOPICS[id].flash); });
  renderFlash(allCards, true);
}

function flipCard(i){
  document.getElementById('fc-'+i).classList.toggle('flipped');
}

/* Keyboard accessibility for Flashcards */
function handleFcKey(e, i, total) {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    flipCard(i);
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault();
    const nextId = (i + 1) % total;
    document.getElementById('fc-' + nextId).focus();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    const prevId = (i - 1 + total) % total;
    document.getElementById('fc-' + prevId).focus();
  }
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

/* Tracking logic */
function markDone(id) {
  doneTopics.add(id);
  updateProgress();
  updateMarkBtnState();
  
  const idx = TOPIC_ORDER.indexOf(id);
  const btns = document.querySelectorAll('.sb-item:not([onclick="showFlashcards()"])');
  if(btns[idx]) btns[idx].classList.add('done');
}

function updateProgress() {
  const pct = (doneTopics.size / TOTAL_TOPICS) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${doneTopics.size} / ${TOTAL_TOPICS} topics read`;
}

function updateMarkBtnState() {
  const btn = document.getElementById('mark-' + currentTopic);
  if (btn) {
    if (doneTopics.has(currentTopic)) {
      btn.textContent = '✓ Read';
      btn.classList.add('marked');
      btn.disabled = true;
    } else {
      btn.textContent = '✓ Mark as read';
      btn.classList.remove('marked');
      btn.disabled = false;
    }
  }
}

// Global Keyboard listener for switching modes
document.addEventListener('keydown', (e) => {
  if(e.altKey) {
    if(e.key === '1') setMode('learn');
    if(e.key === '2') setMode('qa');
    if(e.key === '3') setMode('quiz');
    if(e.key === '4') setMode('flash');
  }
});

// Initial render
loadTopic('u1_basics');
</script>
</body>
</html>
