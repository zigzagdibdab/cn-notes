    {q:"What are the components of SNMP architecture?",a:"Three components: 1) NMS (Network Management Station/Manager) — runs management applications, sends requests. 2) Agent — software on managed device, responds to requests and sends traps. 3) MIB (Management Information Base) — database of managed objects on the agent, queried by manager."},
    {q:"What is the difference between Trap and Inform in SNMP?",a:"Both are agent-to-manager notifications. Trap (SNMPv1/v2c) is unacknowledged — fire and forget. Inform (SNMPv2c/v3) is acknowledged — the manager sends a response; if not received, agent retransmits. Informs are more reliable but create more overhead."},
    {q:"What is ASN.1 and why is it used in SNMP?",a:"ASN.1 (Abstract Syntax Notation One) is a language for defining data structures independently of machine architecture. SNMP uses ASN.1 to define MIB objects and message formats. BER (Basic Encoding Rules) then encodes these ASN.1 structures into bytes for network transmission."},
    {q:"What improvements did SNMPv3 introduce?",a:"SNMPv3 introduced the User-based Security Model (USM) with authentication (MD5 or SHA-1) and encryption (DES or AES). It also introduced VACM (View-based Access Control Model) for granular access control — specifying which manager can access which MIB objects."},
  ],
  quiz:[
    {q:"SNMP agent listens on which UDP port?",opts:["25","161","162","514"],ans:1,exp:"SNMP agent listens on UDP port 161. SNMP traps are sent to port 162 (trap receiver/manager)."},
    {q:"Which SNMP operation is sent by the agent without a request?",opts:["GetRequest","SetRequest","Response","Trap"],ans:3,exp:"Trap is unsolicited — the agent sends it to notify the manager of an event (e.g., link down)."},
    {q:"MIB objects are identified by:",opts:["MAC address","Community string","OID (Object Identifier)","Hostname"],ans:2,exp:"Each MIB object has a unique OID (Object Identifier) — a sequence of integers in the MIB tree."},
    {q:"SNMPv3 security uses which authentication methods?",opts:["DES only","MD5 or SHA","AES only","Community string"],ans:1,exp:"SNMPv3 USM supports MD5 or SHA-1 for authentication, and DES or AES for encryption."},
    {q:"FCAPS stands for:",opts:["Fault, Configuration, Accounting, Performance, Security","Forwarding, Congestion, Authentication, Privacy, Scheduling","File, Control, Access, Policy, Storage","None of the above"],ans:0,exp:"FCAPS = Fault, Configuration, Accounting, Performance, Security — the 5 areas of network management."},
  ],
  flash:[
    {term:"SNMP",def:"Simple Network Management Protocol — manager/agent protocol for monitoring and controlling network devices. UDP 161/162.",tag:"Network Management"},
    {term:"MIB",def:"Management Information Base — hierarchical tree database of manageable objects on a network device.",tag:"Network Management"},
    {term:"OID",def:"Object Identifier — unique dotted-number path in the MIB tree identifying a specific managed object.",tag:"Network Management"},
    {term:"Trap",def:"Unsolicited SNMP message from agent to manager notifying of an event. Unacknowledged (vs Inform).",tag:"Network Management"},
    {term:"ASN.1",def:"Abstract Syntax Notation One — platform-independent language defining MIB structures and SNMP message formats.",tag:"Network Management"},
    {term:"FCAPS",def:"Five areas of network management: Fault, Configuration, Accounting, Performance, Security.",tag:"Network Management"},
  ]
},

security:{
  title:"Network Security",
  tag:"UNIT IV · Security",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT IV · Security</div>
  <h1>Network Security</h1>
  <p>Network security protects data confidentiality, integrity, and availability as it travels through the network.</p>
</div>
<div class="section-card">
  <h3>Security Goals (CIA Triad + more)</h3>
  <div class="table-wrap"><table>
    <tr><th>Goal</th><th>Meaning</th></tr>
    <tr><td>Confidentiality</td><td>Only authorized parties read data (encryption)</td></tr>
    <tr><td>Integrity</td><td>Data not altered in transit (MAC, digital signatures)</td></tr>
    <tr><td>Authentication</td><td>Verify identity of parties (certificates, passwords)</td></tr>
    <tr><td>Availability</td><td>Services accessible when needed (prevent DoS)</td></tr>
    <tr><td>Non-repudiation</td><td>Sender cannot deny sending message (digital signatures)</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Ciphers</h3>
  <div class="table-wrap"><table>
    <tr><th>Type</th><th>Description</th><th>Examples</th></tr>
    <tr><td>Symmetric</td><td>Same key for encrypt/decrypt</td><td>DES, 3DES, AES</td></tr>
    <tr><td>Asymmetric (Public Key)</td><td>Public key encrypts, private key decrypts</td><td>RSA, ECC, Diffie-Hellman</td></tr>
    <tr><td>Hash Functions</td><td>One-way fingerprint</td><td>MD5, SHA-1, SHA-256</td></tr>
  </table></div>
  <div class="formula-box">
Symmetric: C = E(K, P), P = D(K, C)  — fast, key distribution problem
Asymmetric: C = E(K_pub, P), P = D(K_priv, C) — slow, solves key distribution
Digital Signature: Sign = E(K_priv, H(M)), Verify = D(K_pub, Sign) == H(M)
  </div>
  <div class="highlight-box">💡 In practice: use asymmetric to exchange symmetric session key (Diffie-Hellman), then use symmetric for bulk data (AES).</div>
</div>
<div class="section-card">
  <h3>Application Layer Security</h3>
  <ul>
    <li><strong>PGP (Pretty Good Privacy):</strong> Email encryption. Uses hybrid encryption (RSA + symmetric). Digital signatures with RSA/DSA. Web of trust (no CA).</li>
    <li><strong>S/MIME:</strong> Email security standard. Uses digital certificates from CA. More enterprise-oriented than PGP.</li>
    <li><strong>HTTPS:</strong> HTTP over TLS. Port 443. Browser validates server certificate.</li>
  </ul>
</div>
<div class="section-card">
  <h3>Transport Layer Security (TLS/SSL)</h3>
  <p>TLS provides confidentiality, integrity, and authentication between client and server.</p>
  <div class="formula-box">
TLS Handshake:
1. ClientHello — supported ciphers, random number
2. ServerHello — chosen cipher, certificate
3. Client verifies certificate (CA chain)
4. Key Exchange — Diffie-Hellman or RSA
5. Both derive session keys
6. Finished — encrypted with session key
→ Data encrypted with symmetric session key (AES)
  </div>
  <div class="warn-box">⚠️ SSL is deprecated (SSLv3 broken by POODLE). Use TLS 1.2 or TLS 1.3.</div>
</div>
<div class="section-card">
  <h3>Network Layer Security — IPsec</h3>
  <div class="table-wrap"><table>
    <tr><th>Protocol</th><th>Purpose</th></tr>
    <tr><td>AH (Authentication Header)</td><td>Integrity + authentication. NO confidentiality.</td></tr>
    <tr><td>ESP (Encapsulating Security Payload)</td><td>Integrity + authentication + encryption</td></tr>
    <tr><td>IKE</td><td>Internet Key Exchange — negotiate keys for IPsec SA</td></tr>
  </table></div>
  <div class="table-wrap"><table>
    <tr><th>Mode</th><th>Description</th></tr>
    <tr><td>Transport Mode</td><td>Encrypts payload only. Original IP header preserved.</td></tr>
    <tr><td>Tunnel Mode</td><td>Encrypts entire original packet. New IP header added. Used for VPNs.</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Firewalls</h3>
  <div class="table-wrap"><table>
    <tr><th>Type</th><th>Operates at</th><th>Filters based on</th></tr>
    <tr><td>Packet Filter</td><td>Network layer</td><td>IP addresses, ports, protocol, TCP flags</td></tr>
    <tr><td>Stateful Firewall</td><td>Network + Transport</td><td>Connection state tracking</td></tr>
    <tr><td>Proxy Firewall</td><td>Application layer</td><td>Application content, deep inspection</td></tr>
    <tr><td>IDS/IPS</td><td>All layers</td><td>Intrusion signatures, anomaly detection</td></tr>
  </table></div>
  <div class="highlight-box">💡 Packet Filter: Simple, fast. Stateless — cannot track if a packet is response to legitimate request. Proxy: Acts as intermediary — all traffic passes through proxy application.</div>
</div>`,
  qa:[
    {q:"Difference between symmetric and asymmetric encryption.",a:"Symmetric encryption uses the same key for both encryption and decryption (DES, AES). It is fast but has the key distribution problem. Asymmetric encryption uses key pairs: public key encrypts, private key decrypts (RSA). It solves key distribution but is slow. In practice, asymmetric is used to exchange a symmetric session key (hybrid encryption)."},
    {q:"What is IPsec? Explain AH vs ESP.",a:"IPsec is a suite of protocols providing security at the network layer. AH (Authentication Header) provides data integrity and authentication but NO encryption — data is visible. ESP (Encapsulating Security Payload) provides integrity, authentication, AND encryption. ESP is preferred when confidentiality is needed."},
    {q:"Explain TLS handshake steps.",a:"1. ClientHello — client sends supported ciphers and random number. 2. ServerHello — server chooses cipher and sends certificate. 3. Client verifies certificate against trusted CAs. 4. Key exchange (DH/RSA) — both parties derive shared session key. 5. Finished messages — both confirm handshake with encrypted message. Data then encrypted with AES session key."},
    {q:"Difference between packet filter and proxy firewall.",a:"Packet filter operates at the network layer and makes pass/drop decisions based on IP addresses, ports, and TCP flags. It is fast but stateless and cannot inspect application content. Proxy firewall (application gateway) operates at the application layer, acting as an intermediary — it can inspect and filter application content (URLs, commands) but is slower."},
    {q:"What is IPsec Tunnel Mode used for?",a:"Tunnel Mode encrypts the entire original IP packet (header + payload) and adds a new IP header. It is used for VPNs (Virtual Private Networks) — traffic between two sites travels encrypted through the Internet, and the internal IP addresses are hidden from the public network."},
  ],
  quiz:[
    {q:"Which IPsec protocol provides both authentication AND encryption?",opts:["AH","ESP","IKE","SA"],ans:1,exp:"ESP (Encapsulating Security Payload) provides integrity, authentication, and confidentiality (encryption). AH only provides integrity and authentication — no encryption."},
    {q:"TLS operates at which layer?",opts:["Network","Transport","Application","Presentation"],ans:1,exp:"TLS (Transport Layer Security) sits between the transport and application layers, securing TCP connections."},
    {q:"Digital signatures provide:",opts:["Confidentiality only","Authentication and non-repudiation","Availability","Routing security"],ans:1,exp:"Digital signatures use the sender's private key to sign, enabling anyone to verify with the public key. This provides authentication and non-repudiation."},
    {q:"Packet filter firewall examines:",opts:["Email content","HTTP URLs","IP/port headers","VoIP streams"],ans:2,exp:"Packet filters examine IP addresses, port numbers, protocol, and TCP flags — not application content."},
    {q:"Which key does a recipient use to decrypt a message encrypted with RSA?",opts:["Sender's public key","Recipient's public key","Recipient's private key","Shared symmetric key"],ans:2,exp:"In RSA: encrypt with recipient's PUBLIC key, decrypt with recipient's PRIVATE key."},
    {q:"IPsec Tunnel Mode is used for:",opts:["Securing single hosts","VPN between two sites","HTTP encryption","Email security"],ans:1,exp:"IPsec Tunnel Mode encrypts the entire packet and is used for site-to-site VPNs."},
  ],
  flash:[
    {term:"TLS",def:"Transport Layer Security — provides confidentiality, integrity, authentication for TCP connections. Successor to SSL.",tag:"Security"},
    {term:"IPsec ESP",def:"Encapsulating Security Payload — provides encryption + authentication at network layer. Used in VPNs.",tag:"Security"},
    {term:"Digital Signature",def:"Created by encrypting message hash with sender's private key. Provides authentication and non-repudiation.",tag:"Security"},
    {term:"Packet Filter",def:"Stateless firewall at network layer — filters by IP, port, protocol. Fast but cannot track connections.",tag:"Security"},
    {term:"IPsec Tunnel Mode",def:"Encrypts entire IP packet (header+payload), adds new IP header. Used for site-to-site VPNs.",tag:"Security"},
    {term:"AES",def:"Advanced Encryption Standard — symmetric cipher with 128/192/256-bit keys. Gold standard for bulk encryption.",tag:"Security"},
    {term:"Diffie-Hellman",def:"Key exchange protocol allowing two parties to establish shared secret over insecure channel. Used in TLS/IPsec.",tag:"Security"},
    {term:"Proxy Firewall",def:"Application-layer firewall acting as intermediary. Can inspect content, URLs, commands. Slower than packet filter.",tag:"Security"},
  ]
}
};

const TOPIC_ORDER = ['netintro','ipv4','icmpv4','routing','multicast','ipv6','applayer','clientserver','socket','multimedia','netmgmt','security'];

let currentTopic = 'netintro';
let currentMode = 'learn';
let quizState = {};
let activeFilter = 'all';

function loadTopic(id){
  currentTopic = id;
  document.querySelectorAll('.sb-item').forEach(b=>b.classList.remove('active'));
  const btns = document.querySelectorAll('.sb-item');
  const idx = TOPIC_ORDER.indexOf(id);
  if(btns[idx]) btns[idx].classList.add('active');
  document.getElementById('topbar-title').textContent = TOPICS[id].title;
  setMode(currentMode);
  // close sidebar on mobile
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function setMode(mode){
  currentMode = mode;
  ['learn','qa','quiz','flash'].forEach(m=>{
    document.getElementById('page-'+m).classList.remove('active');
    document.getElementById('btn-'+m).classList.remove('active');
  });
  document.getElementById('page-'+mode).classList.add('active');
  document.getElementById('btn-'+mode).classList.add('active');
  
  const t = TOPICS[currentTopic];
  if(mode==='learn') renderLearn(t);
  if(mode==='qa') renderQA(t);
  if(mode==='quiz') renderQuiz(t);
  if(mode==='flash') renderFlash(t.flash, false);
}

function renderLearn(t){
  const idx = TOPIC_ORDER.indexOf(currentTopic);
  const prev = TOPIC_ORDER[idx-1];
  const next = TOPIC_ORDER[idx+1];
  let nav = '<div class="topic-nav">';
  if(prev) nav += `<button class="tnav-btn" onclick="loadTopic('${prev}')">← ${TOPICS[prev].title}</button>`;
  if(next) nav += `<button class="tnav-btn next" onclick="loadTopic('${next}')">${TOPICS[next].title} →</button>`;
  nav += '</div>';
  document.getElementById('page-learn').innerHTML = t.learn + nav;
}

function renderQA(t){
  let html = '<div class="topic-header"><div class="topic-tag">'+t.tag+'</div><h1>Q&A — '+t.title+'</h1><p>Click each question to reveal the answer.</p></div>';
  html += '<div class="qa-list">';
  t.qa.forEach((qa,i)=>{
    html += `<div class="qa-item" id="qa-${i}">
      <div class="qa-q" onclick="toggleQA(${i})">
        <div><span>Q${i+1}.</span>${qa.q}</div>
        <span class="qa-arrow">▼</span>
      </div>
      <div class="qa-a" id="qa-a-${i}">${qa.a}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('page-qa').innerHTML = html;
}

function toggleQA(i){
  const item = document.getElementById('qa-'+i);
  const ans = document.getElementById('qa-a-'+i);
  item.classList.toggle('open');
  ans.classList.toggle('open');
}

function renderQuiz(t){
  quizState = {answers:{}, submitted:{}};
  let html = `<div class="quiz-header"><h2>Quiz — ${t.title}</h2><p>${t.quiz.length} questions. Select an answer to check instantly.</p></div>`;
  t.quiz.forEach((q,i)=>{
    const labels = ['A','B','C','D','E'];
    let opts = q.opts.map((o,j)=>`
      <button class="opt" id="opt-${i}-${j}" onclick="selectOpt(${i},${j})">
        <span class="opt-label">${labels[j]}</span>${o}
      </button>`).join('');
    html += `<div class="quiz-q">
      <div class="qnum">QUESTION ${i+1} OF ${t.quiz.length}</div>
      <div class="qtext">${q.q}</div>
      <div class="options" id="opts-${i}">${opts}</div>
      <div class="explanation" id="exp-${i}">💡 ${q.exp}</div>
    </div>`;
  });
  document.getElementById('page-quiz').innerHTML = html;
}

function selectOpt(qi,oi){
  if(quizState.submitted[qi]) return;
  quizState.submitted[qi] = true;
  const t = TOPICS[currentTopic];
  const correct = t.quiz[qi].ans;
  const opts = document.getElementById('opts-'+qi).querySelectorAll('.opt');
  opts.forEach((o,j)=>{
    o.disabled = true;
    if(j===correct) o.classList.add(oi===correct ? 'correct' : 'reveal-correct');
    if(j===oi && oi!==correct) o.classList.add('wrong');
  });
  document.getElementById('exp-'+qi).classList.add('show');
}

function showFlashcards(){
  currentMode = 'flash';
  ['learn','qa','quiz','flash'].forEach(m=>{
    document.getElementById('page-'+m).classList.remove('active');
    document.getElementById('btn-'+m).classList.remove('active');
  });
  document.getElementById('page-flash').classList.add('active');
  document.getElementById('btn-flash').classList.add('active');
  // collect all flashcards
  let allCards = [];
  TOPIC_ORDER.forEach(id=>{ if(TOPICS[id].flash) allCards = allCards.concat(TOPICS[id].flash); });
  renderFlash(allCards, true);
}

function renderFlash(cards, showFilter){
  const tags = [...new Set(cards.map(c=>c.tag))];
  let filtered = activeFilter==='all' ? cards : cards.filter(c=>c.tag===activeFilter);
  
  let html = '<div class="topic-header"><h1>Flashcards</h1><p>Click a card to flip it and reveal the definition.</p></div>';
  
  if(showFilter){
    html += '<div class="fc-controls">';
    html += `<button class="filter-btn ${activeFilter==='all'?'active':''}" onclick="filterFlash('all', true)">All (${cards.length})</button>`;
    tags.forEach(tag=>{
      const cnt = cards.filter(c=>c.tag===tag).length;
      html += `<button class="filter-btn ${activeFilter===tag?'active':''}" onclick="filterFlash('${tag}', true)">${tag} (${cnt})</button>`;
    });
    html += '</div>';
  }
  
  html += '<div class="fc-grid">';
  filtered.forEach((c,i)=>{
    html += `<div class="fc" id="fc-${i}" onclick="flipCard(${i})">
      <div class="fc-inner">
        <div class="fc-front">
          <div class="fc-tag">${c.tag}</div>
          <div class="term">${c.term}</div>
          <div class="hint">Click to reveal →</div>
        </div>
        <div class="fc-back">
          <div class="fc-tag">${c.term}</div>
          <div class="def">${c.def}</div>
        </div>
      </div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('page-flash').innerHTML = html;
}

function filterFlash(tag, global){
  activeFilter = tag;
  let allCards = [];
  TOPIC_ORDER.forEach(id=>{ if(TOPICS[id].flash) allCards = allCards.concat(TOPICS[id].flash); });
  renderFlash(allCards, true);
}

function flipCard(i){
  document.getElementById('fc-'+i).classList.toggle('flipped');
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

// Initial render
loadTopic('netintro');
setMode('learn');
</script>
</body>
