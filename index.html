<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Computer Networks — Units III & IV</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0d14;
  --surface:#111520;
  --card:#161c2d;
  --border:#1e2740;
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --accent3:#10b981;
  --warn:#f59e0b;
  --danger:#ef4444;
  --text:#e2e8f0;
  --muted:#64748b;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
code,pre{font-family:'JetBrains Mono',monospace}

/* SIDEBAR */
#sidebar{position:fixed;left:0;top:0;height:100vh;width:260px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;z-index:100;transition:transform .3s}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.sb-header{padding:20px;border-bottom:1px solid var(--border)}
.sb-header h2{font-size:1rem;color:var(--accent);letter-spacing:.05em}
.sb-header p{font-size:.75rem;color:var(--muted);margin-top:4px}
.sb-section{padding:8px 12px;font-size:.65rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:8px}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 16px;cursor:pointer;border-radius:8px;margin:2px 8px;font-size:.82rem;color:var(--muted);transition:all .2s;border:none;background:none;width:calc(100% - 16px);text-align:left}
.sb-item:hover{background:var(--card);color:var(--text)}
.sb-item.active{background:rgba(0,212,255,.1);color:var(--accent);border-left:2px solid var(--accent)}
.sb-dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.5;flex-shrink:0}

/* MAIN */
#main{margin-left:260px;min-height:100vh}
#topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:50}
#topbar h1{font-size:1rem;color:var(--text)}
.mode-btns{display:flex;gap:6px}
.mode-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .2s;font-family:'Syne',sans-serif}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700}
#content{padding:40px;max-width:900px}

/* PAGES */
.page{display:none}
.page.active{display:block}

/* LESSON */
.topic-header{margin-bottom:32px}
.topic-tag{display:inline-block;padding:3px 10px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);border-radius:20px;font-size:.72rem;color:var(--accent);margin-bottom:12px;font-family:'Syne',sans-serif;letter-spacing:.05em}
.topic-header h1{font-size:2.2rem;font-weight:800;line-height:1.2}
.topic-header p{color:var(--muted);margin-top:12px;font-size:.95rem;line-height:1.7}
.section-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px}
.section-card h3{font-size:1.1rem;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.section-card h3::before{content:'';display:block;width:3px;height:18px;background:var(--accent);border-radius:2px}
.section-card p,.section-card li{line-height:1.8;color:#cbd5e1;font-size:.9rem}
.section-card ul,.section-card ol{padding-left:20px;margin-top:8px}
.section-card li{margin-bottom:6px}
.formula-box{background:#0d1117;border:1px solid var(--accent2);border-radius:8px;padding:16px;margin:14px 0;font-family:'JetBrains Mono',monospace;font-size:.88rem;color:#c4b5fd;line-height:1.8}
.highlight-box{background:rgba(16,185,129,.08);border-left:3px solid var(--accent3);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0;font-size:.88rem;color:#a7f3d0}
.warn-box{background:rgba(245,158,11,.08);border-left:3px solid var(--warn);padding:14px 18px;border-radius:0 8px 8px 0;margin:14px 0;font-size:.88rem;color:#fde68a}
.table-wrap{overflow-x:auto;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{background:rgba(0,212,255,.08);color:var(--accent);padding:10px 14px;text-align:left;border:1px solid var(--border);font-family:'Syne',sans-serif}
td{padding:10px 14px;border:1px solid var(--border);color:#cbd5e1;vertical-align:top}
tr:hover td{background:rgba(255,255,255,.02)}

/* Q&A */
.qa-list{margin-top:8px}
.qa-item{border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.qa-q{padding:16px 20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--card);font-size:.9rem;font-weight:500;transition:background .2s}
.qa-q:hover{background:#1a2136}
.qa-q span:first-child{color:var(--accent);margin-right:10px;font-family:'Syne',sans-serif;font-size:.8rem}
.qa-arrow{transition:transform .3s;color:var(--muted);font-size:1.1rem}
.qa-a{display:none;padding:16px 20px;background:#0f1520;border-top:1px solid var(--border);font-size:.88rem;line-height:1.8;color:#94a3b8}
.qa-a.open{display:block}
.qa-item.open .qa-arrow{transform:rotate(180deg)}

/* QUIZ */
.quiz-header{margin-bottom:28px}
.quiz-header h2{font-size:1.5rem;font-weight:700}
.quiz-header p{color:var(--muted);margin-top:6px}
.quiz-q{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.quiz-q .qnum{font-size:.72rem;color:var(--accent);font-family:'Syne',sans-serif;letter-spacing:.1em;margin-bottom:8px}
.quiz-q .qtext{font-size:.95rem;margin-bottom:16px;line-height:1.6}
.options{display:grid;gap:8px}
.opt{padding:12px 16px;border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:.88rem;transition:all .2s;background:var(--surface);text-align:left;color:var(--text);display:flex;align-items:center;gap:10px}
.opt:hover{border-color:var(--accent);background:rgba(0,212,255,.05)}
.opt.correct{border-color:var(--accent3)!important;background:rgba(16,185,129,.1)!important;color:#6ee7b7}
.opt.wrong{border-color:var(--danger)!important;background:rgba(239,68,68,.1)!important;color:#fca5a5}
.opt.reveal-correct{border-color:var(--accent3)!important;background:rgba(16,185,129,.05)!important}
.opt-label{width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:.72rem;flex-shrink:0;font-family:'Syne',sans-serif}
.explanation{margin-top:12px;padding:12px 16px;background:rgba(0,212,255,.05);border-radius:8px;font-size:.84rem;color:#94a3b8;display:none}
.explanation.show{display:block}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.btn{padding:10px 24px;border-radius:8px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-size:.85rem;font-weight:600;transition:all .2s}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{opacity:.9}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.score-card{text-align:center;padding:40px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)}
.score-num{font-size:4rem;font-weight:800;color:var(--accent);font-family:'Syne',sans-serif}
.score-card p{color:var(--muted);margin-top:8px}

/* FLASHCARDS */
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.fc{perspective:1000px;height:180px;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;border:1px solid var(--border)}
.fc-front{background:var(--card)}
.fc-back{background:linear-gradient(135deg,#0f1f3d,#1a0a2e);transform:rotateY(180deg);border-color:var(--accent2)}
.fc-front .term{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:var(--accent)}
.fc-front .hint{font-size:.72rem;color:var(--muted);margin-top:8px}
.fc-back .def{font-size:.82rem;line-height:1.6;color:#c4b5fd}
.fc-tag{font-size:.65rem;color:var(--accent2);font-family:'Syne',sans-serif;letter-spacing:.1em;margin-bottom:8px;text-transform:uppercase}
.fc-flip-hint{font-size:.65rem;color:var(--muted);margin-top:12px}
.fc-controls{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--muted);font-size:.75rem;cursor:pointer;transition:all .2s}
.filter-btn.active{background:rgba(124,58,237,.2);border-color:var(--accent2);color:#c4b5fd}

/* NAV ARROWS */
.topic-nav{display:flex;gap:12px;margin-top:32px;padding-top:24px;border-top:1px solid var(--border)}
.tnav-btn{padding:10px 20px;border-radius:8px;border:1px solid var(--border);background:none;color:var(--muted);font-size:.82rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;font-family:'Syne',sans-serif}
.tnav-btn:hover{border-color:var(--accent);color:var(--accent)}
.tnav-btn.next{margin-left:auto;background:rgba(0,212,255,.08);color:var(--accent);border-color:rgba(0,212,255,.3)}

/* RESPONSIVE */
@media(max-width:768px){
  #sidebar{transform:translateX(-260px)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #content{padding:20px}
  .topic-header h1{font-size:1.6rem}
  #hamburger{display:flex!important}
}
#hamburger{display:none;position:fixed;top:14px;left:14px;z-index:200;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;cursor:pointer;flex-direction:column;gap:4px}
#hamburger span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90}
.overlay.show{display:block}

/* Progress bar */
.progress-bar{height:3px;background:var(--border);border-radius:2px;margin:16px 0}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .3s}
</style>
</head>
<body>

<button id="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div id="sidebar">
  <div class="sb-header">
    <h2>CN UNITS III & IV</h2>
    <p>Computer Networks</p>
  </div>
  <div class="sb-section">UNIT III — Network Layer</div>
  <button class="sb-item active" onclick="loadTopic('netintro')"><span class="sb-dot"></span>Network Layer Intro</button>
  <button class="sb-item" onclick="loadTopic('ipv4')"><span class="sb-dot"></span>IPv4 & Addressing</button>
  <button class="sb-item" onclick="loadTopic('icmpv4')"><span class="sb-dot"></span>ICMPv4</button>
  <button class="sb-item" onclick="loadTopic('routing')"><span class="sb-dot"></span>Unicast Routing</button>
  <button class="sb-item" onclick="loadTopic('multicast')"><span class="sb-dot"></span>Multicast Routing</button>
  <button class="sb-item" onclick="loadTopic('ipv6')"><span class="sb-dot"></span>IPv6 & ICMPv6</button>
  <div class="sb-section">UNIT III — Application Layer</div>
  <button class="sb-item" onclick="loadTopic('applayer')"><span class="sb-dot"></span>Application Layer</button>
  <button class="sb-item" onclick="loadTopic('clientserver')"><span class="sb-dot"></span>Client-Server & P2P</button>
  <button class="sb-item" onclick="loadTopic('socket')"><span class="sb-dot"></span>Socket Programming</button>
  <div class="sb-section">UNIT IV — Multimedia & QoS</div>
  <button class="sb-item" onclick="loadTopic('multimedia')"><span class="sb-dot"></span>Multimedia & QoS</button>
  <button class="sb-item" onclick="loadTopic('netmgmt')"><span class="sb-dot"></span>Network Management</button>
  <button class="sb-item" onclick="loadTopic('security')"><span class="sb-dot"></span>Network Security</button>
  <div class="sb-section">TOOLS</div>
  <button class="sb-item" onclick="showFlashcards()"><span class="sb-dot"></span>All Flashcards</button>
</div>

<div id="main">
  <div id="topbar">
    <h1 id="topbar-title">Network Layer Introduction</h1>
    <div class="mode-btns">
      <button class="mode-btn active" id="btn-learn" onclick="setMode('learn')">Learn</button>
      <button class="mode-btn" id="btn-qa" onclick="setMode('qa')">Q&A</button>
      <button class="mode-btn" id="btn-quiz" onclick="setMode('quiz')">Quiz</button>
      <button class="mode-btn" id="btn-flash" onclick="setMode('flash')">Flashcards</button>
    </div>
  </div>
  <div id="content">
    <div id="page-learn" class="page active"></div>
    <div id="page-qa" class="page"></div>
    <div id="page-quiz" class="page"></div>
    <div id="page-flash" class="page"></div>
  </div>
</div>

<script>
// ===================== DATA =====================
const TOPICS = {
netintro:{
  title:"Network Layer Introduction",
  tag:"UNIT III · Network Layer",
  unit:"Network Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Network Layer</div>
  <h1>Network Layer Introduction</h1>
  <p>The Network Layer (Layer 3) is responsible for logical addressing and routing — moving packets from source to destination across multiple networks.</p>
</div>
<div class="section-card">
  <h3>Key Responsibilities</h3>
  <ul>
    <li><strong>Logical Addressing:</strong> Assigns unique IP addresses to identify each device globally.</li>
    <li><strong>Routing:</strong> Finds the best path from source to destination across routers.</li>
    <li><strong>Packet Forwarding:</strong> Moves packets hop-by-hop based on routing tables.</li>
    <li><strong>Fragmentation & Reassembly:</strong> Splits large packets to fit smaller MTU links.</li>
    <li><strong>Error Reporting:</strong> Uses ICMP to inform about delivery failures.</li>
  </ul>
</div>
<div class="section-card">
  <h3>Connection-Oriented vs Connectionless</h3>
  <div class="table-wrap"><table>
    <tr><th>Feature</th><th>Connection-Oriented (VC)</th><th>Connectionless (Datagram)</th></tr>
    <tr><td>Path</td><td>Fixed (Virtual Circuit)</td><td>Dynamic per packet</td></tr>
    <tr><td>Setup</td><td>Required before data</td><td>Not required</td></tr>
    <tr><td>Example</td><td>ATM, X.25</td><td>IP (Internet)</td></tr>
    <tr><td>Reliability</td><td>Guaranteed order</td><td>Best-effort</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Packet Switching</h3>
  <p>Internet uses <strong>datagram (packet) switching</strong>. Each packet carries the destination address and routers independently decide the next hop. Packets may arrive out of order — upper layers handle reordering.</p>
  <div class="highlight-box">💡 The Internet's design principle: keep the network simple (best-effort delivery) and put complexity at endpoints (TCP).</div>
</div>
<div class="section-card">
  <h3>Network Layer Services</h3>
  <ul>
    <li>Guaranteed delivery</li>
    <li>Guaranteed delivery with bounded delay</li>
    <li>In-order packet delivery</li>
    <li>Guaranteed minimum bandwidth</li>
    <li>Security (IPsec)</li>
  </ul>
  <div class="warn-box">⚠️ The Internet (IP) provides NONE of these guarantees — it is best-effort. TCP at the transport layer compensates.</div>
</div>`,
  qa:[
    {q:"What is the primary function of the network layer?",a:"The network layer is responsible for logical addressing (IP addresses) and routing — selecting the best path to move packets from a source host to a destination host across multiple interconnected networks."},
    {q:"What is the difference between packet switching and circuit switching?",a:"In circuit switching, a dedicated path is established before communication (like phone calls). In packet switching, data is divided into packets that are independently routed; no path is reserved. The Internet uses packet switching (specifically datagram switching)."},
    {q:"Why is the Internet called a 'best-effort' network?",a:"The IP layer makes no guarantees about delivery, delay, ordering, or bandwidth. It simply tries its best to deliver packets. Reliability guarantees are handled by TCP at the transport layer."},
    {q:"What is fragmentation in the network layer?",a:"When a packet is larger than the Maximum Transmission Unit (MTU) of a link, the network layer breaks it into smaller fragments. Each fragment travels independently and is reassembled at the destination."},
    {q:"What is a Virtual Circuit network?",a:"In a virtual circuit network, a logical path (virtual circuit) is established before data transfer. All packets follow the same path. Examples: ATM, X.25. The Internet does NOT use virtual circuits."},
  ],
  quiz:[
    {q:"Which layer is responsible for logical addressing and routing?",opts:["Data Link","Transport","Network","Physical"],ans:2,exp:"The Network Layer (Layer 3) handles IP addressing and routing decisions."},
    {q:"The Internet uses which switching technique?",opts:["Circuit switching","Message switching","Datagram packet switching","Virtual circuit"],ans:2,exp:"The Internet uses connectionless datagram packet switching — each packet is independently routed."},
    {q:"What does 'best-effort delivery' mean in IP?",opts:["Guaranteed delivery","Fastest possible delivery","No guarantees on delivery, delay or order","Encrypted delivery"],ans:2,exp:"IP provides best-effort service: packets may be lost, duplicated, or arrive out of order."},
    {q:"Fragmentation is done when packet size exceeds:",opts:["Window size","MTU","TTL","Header size"],ans:1,exp:"MTU (Maximum Transmission Unit) is the maximum packet size a link can carry. If a packet exceeds MTU, it is fragmented."},
    {q:"Which protocol provides error reporting at the network layer?",opts:["TCP","UDP","ICMP","ARP"],ans:2,exp:"ICMP (Internet Control Message Protocol) provides error reporting and diagnostic functions at the network layer."},
  ],
  flash:[
    {term:"Routing",def:"Process of selecting the path for packets to travel from source to destination across multiple networks using routing tables.",tag:"Network Layer"},
    {term:"MTU",def:"Maximum Transmission Unit — the largest packet size a network link can carry. Exceeded packets are fragmented.",tag:"Network Layer"},
    {term:"Best-effort",def:"IP delivery model — no guarantees on delivery, ordering, or delay. Reliability added by TCP.",tag:"Network Layer"},
    {term:"Datagram",def:"Self-contained packet with source/destination address, independently routed through the network.",tag:"Network Layer"},
  ]
},

ipv4:{
  title:"IPv4 & Addressing",
  tag:"UNIT III · Network Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Network Layer</div>
  <h1>IPv4 & Addressing</h1>
  <p>IPv4 uses 32-bit addresses. Understanding classful addressing, subnetting, and the IPv4 packet format is essential for exams.</p>
</div>
<div class="section-card">
  <h3>Internet Address Structure</h3>
  <p>IPv4 addresses are 32-bit numbers written in dotted-decimal notation (e.g., 192.168.1.10). An IP address has two parts:</p>
  <div class="formula-box">IP Address = Network ID + Host ID</div>
  <div class="table-wrap"><table>
    <tr><th>Class</th><th>First Octet</th><th>Network bits</th><th>Host bits</th><th>Range</th><th>Usage</th></tr>
    <tr><td>A</td><td>0xxxxxxx</td><td>8</td><td>24</td><td>0–127</td><td>Large networks</td></tr>
    <tr><td>B</td><td>10xxxxxx</td><td>16</td><td>16</td><td>128–191</td><td>Medium networks</td></tr>
    <tr><td>C</td><td>110xxxxx</td><td>24</td><td>8</td><td>192–223</td><td>Small networks</td></tr>
    <tr><td>D</td><td>1110xxxx</td><td>N/A</td><td>N/A</td><td>224–239</td><td>Multicast</td></tr>
    <tr><td>E</td><td>1111xxxx</td><td>N/A</td><td>N/A</td><td>240–255</td><td>Reserved</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Subnetting</h3>
  <p>Subnetting borrows bits from the host portion to create smaller sub-networks.</p>
  <div class="formula-box">
Number of subnets = 2^n  (n = borrowed bits)
Hosts per subnet = 2^h - 2  (h = remaining host bits)
Subnet Mask: 1s for network+subnet bits, 0s for host bits
  </div>
  <div class="highlight-box">
  Example: Class C network 192.168.1.0 with /26 subnet mask<br>
  /26 → 26 bits for network, 6 bits for host<br>
  Subnets = 2^2 = 4 | Hosts/subnet = 2^6 - 2 = 62
  </div>
  <div class="warn-box">⚠️ Always subtract 2 from hosts (network address + broadcast address are unusable).</div>
</div>
<div class="section-card">
  <h3>CIDR — Classless Inter-Domain Routing</h3>
  <p>CIDR removes class boundaries. A network is written as address/prefix-length (e.g., 10.0.0.0/22).</p>
  <ul>
    <li>Allows flexible allocation of IP blocks</li>
    <li>Enables route aggregation (supernetting) to reduce routing table size</li>
    <li>Example: 192.168.0.0/22 covers 192.168.0.x to 192.168.3.x (1022 hosts)</li>
  </ul>
</div>
<div class="section-card">
  <h3>IPv4 Packet Header</h3>
  <div class="formula-box">
VER | HLEN | Service Type | Total Length (16)
Identification (16) | Flags (3) | Fragment Offset (13)
TTL (8) | Protocol (8) | Header Checksum (16)
Source IP Address (32)
Destination IP Address (32)
Options + Padding
  </div>
  <div class="table-wrap"><table>
    <tr><th>Field</th><th>Size</th><th>Purpose</th></tr>
    <tr><td>VER</td><td>4 bits</td><td>IP version (4)</td></tr>
    <tr><td>HLEN</td><td>4 bits</td><td>Header length in 32-bit words</td></tr>
    <tr><td>TTL</td><td>8 bits</td><td>Decremented at each hop; packet dropped at 0</td></tr>
    <tr><td>Protocol</td><td>8 bits</td><td>Upper layer: 6=TCP, 17=UDP, 1=ICMP</td></tr>
    <tr><td>Flags</td><td>3 bits</td><td>DF (Don't Fragment), MF (More Fragments)</td></tr>
    <tr><td>Fragment Offset</td><td>13 bits</td><td>Position of fragment in original packet</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Private IP Ranges (RFC 1918)</h3>
  <div class="formula-box">
Class A: 10.0.0.0/8
Class B: 172.16.0.0/12
Class C: 192.168.0.0/16
  </div>
  <p>Private IPs are not routed on the Internet. NAT (Network Address Translation) maps them to public IPs.</p>
</div>`,
  qa:[
    {q:"How many usable hosts does a /27 subnet provide?",a:"A /27 subnet has 32 - 27 = 5 host bits. Total addresses = 2^5 = 32. Usable hosts = 32 - 2 = 30 (subtract network address and broadcast address)."},
    {q:"What is CIDR and why was it introduced?",a:"CIDR (Classless Inter-Domain Routing) was introduced to solve IPv4 address exhaustion and routing table explosion. It removes class boundaries and allows flexible allocation of any prefix length (e.g., /22, /20). It also enables route summarization (supernetting)."},
    {q:"What does the TTL field do in an IPv4 header?",a:"TTL (Time To Live) is decremented by 1 at each router. When it reaches 0, the router drops the packet and sends an ICMP 'Time Exceeded' message back to the source. It prevents packets from looping forever in the network."},
    {q:"Difference between DF and MF flags in IPv4?",a:"DF (Don't Fragment) tells routers NOT to fragment the packet. If it must be fragmented, the router drops it and sends ICMP error. MF (More Fragments) is set on all fragments except the last one, telling the receiver more fragments are coming."},
    {q:"What are the private IP address ranges?",a:"RFC 1918 defines three private ranges: 10.0.0.0/8 (Class A), 172.16.0.0/12 (Class B), and 192.168.0.0/16 (Class C). These are not routable on the public Internet and require NAT."},
    {q:"What is subnetting? Give an example.",a:"Subnetting divides a large network into smaller sub-networks by borrowing bits from the host portion. Example: 192.168.1.0/26 borrows 2 bits, giving 4 subnets each with 62 usable hosts (2^6 - 2 = 62)."},
  ],
  quiz:[
    {q:"What is the subnet mask for /26?",opts:["255.255.255.0","255.255.255.128","255.255.255.192","255.255.255.224"],ans:2,exp:"/26 means 26 ones: 11111111.11111111.11111111.11000000 = 255.255.255.192"},
    {q:"How many usable hosts in a /29 subnet?",opts:["6","8","14","30"],ans:0,exp:"/29 → 3 host bits → 2^3 = 8 total → 8-2 = 6 usable hosts."},
    {q:"Which class of IP address starts with bits '110'?",opts:["Class A","Class B","Class C","Class D"],ans:2,exp:"Class C starts with 110 (first octet 192–223)."},
    {q:"The Protocol field value '17' in IPv4 header indicates:",opts:["TCP","ICMP","UDP","OSPF"],ans:2,exp:"Protocol 17 = UDP. Protocol 6 = TCP, Protocol 1 = ICMP."},
    {q:"CIDR notation 192.168.4.0/22 covers how many addresses?",opts:["256","512","1024","2048"],ans:2,exp:"/22 → 32-22 = 10 host bits → 2^10 = 1024 total addresses."},
    {q:"Which flag prevents a packet from being fragmented?",opts:["MF","DF","RF","CF"],ans:1,exp:"DF = Don't Fragment. If set and packet exceeds MTU, it is dropped and ICMP error is sent."},
  ],
  flash:[
    {term:"CIDR",def:"Classless Inter-Domain Routing — uses prefix notation (/24) instead of classes; enables flexible subnetting and route aggregation.",tag:"IPv4"},
    {term:"Subnet Mask",def:"32-bit mask with 1s for network/subnet bits and 0s for host bits. Used to determine which part of IP is network vs host.",tag:"IPv4"},
    {term:"TTL",def:"Time To Live — decremented at each router hop; prevents infinite routing loops. Packet dropped when TTL=0.",tag:"IPv4"},
    {term:"NAT",def:"Network Address Translation — maps private IP addresses to a public IP, allowing multiple devices to share one public IP.",tag:"IPv4"},
    {term:"Fragment Offset",def:"13-bit field indicating position (in 8-byte units) of a fragment within the original datagram.",tag:"IPv4"},
    {term:"Broadcast Address",def:"Last address in a subnet (all host bits = 1). Cannot be assigned to a host. Used to send to all hosts in subnet.",tag:"IPv4"},
  ]
},

icmpv4:{
  title:"ICMPv4",
  tag:"UNIT III · Network Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Network Layer</div>
  <h1>ICMPv4 — Internet Control Message Protocol</h1>
  <p>ICMP is used by network devices to send error messages and operational information. It works alongside IP but is considered part of the network layer.</p>
</div>
<div class="section-card">
  <h3>ICMP Message Format</h3>
  <div class="formula-box">
Type (8) | Code (8) | Checksum (16)
Rest of Header (32) — depends on type
Data (variable)
  </div>
  <p>ICMP messages are encapsulated in IP packets. The <strong>Type</strong> field identifies the message category; <strong>Code</strong> gives additional detail.</p>
</div>
<div class="section-card">
  <h3>Common ICMP Message Types</h3>
  <div class="table-wrap"><table>
    <tr><th>Type</th><th>Message</th><th>Description</th></tr>
    <tr><td>0</td><td>Echo Reply</td><td>Response to ping</td></tr>
    <tr><td>3</td><td>Destination Unreachable</td><td>Host/network/port unreachable</td></tr>
    <tr><td>4</td><td>Source Quench</td><td>Congestion control (deprecated)</td></tr>
    <tr><td>5</td><td>Redirect</td><td>Better route available</td></tr>
    <tr><td>8</td><td>Echo Request</td><td>Ping request</td></tr>
    <tr><td>11</td><td>Time Exceeded</td><td>TTL expired (traceroute uses this)</td></tr>
    <tr><td>12</td><td>Parameter Problem</td><td>Bad IP header</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Destination Unreachable Codes</h3>
  <div class="table-wrap"><table>
    <tr><th>Code</th><th>Meaning</th></tr>
    <tr><td>0</td><td>Network unreachable</td></tr>
    <tr><td>1</td><td>Host unreachable</td></tr>
    <tr><td>2</td><td>Protocol unreachable</td></tr>
    <tr><td>3</td><td>Port unreachable</td></tr>
    <tr><td>4</td><td>Fragmentation needed but DF set</td></tr>
    <tr><td>5</td><td>Source route failed</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>ICMP Applications</h3>
  <ul>
    <li><strong>Ping:</strong> Sends Echo Request (Type 8), receives Echo Reply (Type 0). Tests reachability and measures RTT.</li>
    <li><strong>Traceroute:</strong> Sends packets with TTL=1,2,3... Each router that drops the packet sends ICMP Time Exceeded (Type 11), revealing the path.</li>
    <li><strong>Path MTU Discovery:</strong> Sends DF-bit packets; if ICMP Type 3 Code 4 received, reduces packet size.</li>
  </ul>
  <div class="highlight-box">💡 Traceroute trick: sends UDP packets to unlikely ports; destination sends ICMP Port Unreachable (Type 3, Code 3) when it arrives.</div>
</div>`,
  qa:[
    {q:"What ICMP message does Ping use?",a:"Ping sends an ICMP Echo Request (Type 8, Code 0) to the destination. The destination replies with an ICMP Echo Reply (Type 0, Code 0). The round-trip time is measured for latency."},
    {q:"How does Traceroute work using ICMP?",a:"Traceroute sends packets with TTL starting at 1. The first router decrements TTL to 0, drops the packet, and sends back ICMP Time Exceeded (Type 11). Traceroute increments TTL each time, revealing each hop's IP until destination is reached (which sends ICMP Port Unreachable)."},
    {q:"What is ICMP Redirect?",a:"ICMP Redirect (Type 5) is sent by a router to a host when a better route exists for a given destination. The router forwards the packet but informs the host to update its routing cache to use the better gateway directly."},
    {q:"Why is ICMP Source Quench deprecated?",a:"ICMP Source Quench (Type 4) was used for congestion control — a router would ask the source to slow down. It was deprecated because it's inefficient and modern congestion control (like TCP's AIMD) works more effectively without it."},
  ],
  quiz:[
    {q:"What ICMP type is sent when TTL expires?",opts:["Type 0","Type 3","Type 8","Type 11"],ans:3,exp:"Type 11 = Time Exceeded. Sent when a router drops a packet because TTL reached 0. Used by traceroute."},
    {q:"Ping uses which pair of ICMP types?",opts:["0 and 3","8 and 0","3 and 11","5 and 8"],ans:1,exp:"Echo Request = Type 8, Echo Reply = Type 0. Ping sends Type 8 and receives Type 0."},
    {q:"ICMP Type 3, Code 4 means:",opts:["Host unreachable","Port unreachable","Fragmentation needed but DF set","Network unreachable"],ans:2,exp:"Type 3 = Destination Unreachable. Code 4 = Fragmentation Needed and DF bit was set."},
    {q:"ICMP is carried at which layer?",opts:["Transport Layer","Data Link Layer","Network Layer","Application Layer"],ans:2,exp:"ICMP is a network layer protocol, encapsulated in IP packets (Protocol number 1)."},
    {q:"Traceroute identifies routers using:",opts:["Echo Reply","Redirect","Time Exceeded","Source Quench"],ans:2,exp:"Each router that drops a packet (TTL=0) sends ICMP Time Exceeded (Type 11), which reveals its IP address."},
  ],
  flash:[
    {term:"ICMP",def:"Internet Control Message Protocol — provides error reporting and diagnostic functions for IP. Not for user data.",tag:"ICMPv4"},
    {term:"Echo Request/Reply",def:"ICMP Types 8/0. Used by Ping to test connectivity and measure round-trip time.",tag:"ICMPv4"},
    {term:"Time Exceeded",def:"ICMP Type 11 — sent when TTL reaches 0. Used by Traceroute to discover network path.",tag:"ICMPv4"},
    {term:"Destination Unreachable",def:"ICMP Type 3 — 12 codes indicating network, host, port, or protocol unreachability.",tag:"ICMPv4"},
    {term:"Traceroute",def:"Tool that sends packets with increasing TTL values to map the path (hops) to a destination.",tag:"ICMPv4"},
  ]
},

routing:{
  title:"Unicast Routing",
  tag:"UNIT III · Network Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Network Layer</div>
  <h1>Unicast Routing</h1>
  <p>Unicast routing finds the best path from one source to one specific destination. Three major algorithm families: Distance Vector, Link State, and Path Vector.</p>
</div>
<div class="section-card">
  <h3>Routing Algorithm Classification</h3>
  <div class="table-wrap"><table>
    <tr><th>Type</th><th>Algorithm</th><th>Protocol</th><th>Key Metric</th></tr>
    <tr><td>Distance Vector</td><td>Bellman-Ford</td><td>RIP</td><td>Hop count</td></tr>
    <tr><td>Link State</td><td>Dijkstra's SPF</td><td>OSPF</td><td>Cost (bandwidth-based)</td></tr>
    <tr><td>Path Vector</td><td>Modified DV with path</td><td>BGP</td><td>Policy-based</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Distance Vector Routing (RIP)</h3>
  <p>Each router maintains a table of (destination, distance, next-hop). Routers share their entire table with <em>neighbors only</em> at regular intervals.</p>
  <div class="formula-box">
D(x,y) = cost of direct link x→y
D(x,z) = min over all neighbors v { cost(x,v) + D(v,z) }
  </div>
  <ul>
    <li><strong>RIP:</strong> Max 15 hops (16 = infinity/unreachable). Updates every 30 sec.</li>
    <li><strong>Count-to-infinity problem:</strong> Bad news travels slowly. Fixed by split horizon, poison reverse.</li>
    <li><strong>Convergence:</strong> Slow. Can take minutes after topology change.</li>
  </ul>
  <div class="warn-box">⚠️ Split Horizon: Never advertise a route back to the interface you learned it from. Poison Reverse: Advertise it but with metric=infinity.</div>
</div>
<div class="section-card">
  <h3>Link State Routing (OSPF)</h3>
  <p>Each router builds a complete map of the network topology using Link State Advertisements (LSAs). Dijkstra's algorithm computes shortest paths.</p>
  <ul>
    <li>Each router floods LSAs to ALL routers (not just neighbors)</li>
    <li>All routers have identical topology database</li>
    <li>Dijkstra run locally to compute shortest path tree</li>
    <li>Faster convergence than Distance Vector</li>
    <li>OSPF divides network into <strong>Areas</strong> to reduce LSA flooding</li>
  </ul>
  <div class="highlight-box">💡 OSPF cost = 10^8 / bandwidth. Lower bandwidth = higher cost = less preferred path.</div>
</div>
<div class="section-card">
  <h3>BGP — Border Gateway Protocol</h3>
  <p>BGP is the routing protocol of the Internet, used between Autonomous Systems (AS). It is a Path Vector protocol.</p>
  <ul>
    <li>Uses TCP port 179</li>
    <li>Advertises AS-PATH (list of AS numbers) — loop detection</li>
    <li>Policy-driven: routes can be accepted/rejected based on business agreements</li>
    <li>eBGP: between different AS | iBGP: within same AS</li>
    <li>BGP attributes: AS-PATH, NEXT-HOP, LOCAL-PREF, MED</li>
  </ul>
</div>
<div class="section-card">
  <h3>Intra-AS vs Inter-AS Routing</h3>
  <div class="table-wrap"><table>
    <tr><th>Feature</th><th>Intra-AS (IGP)</th><th>Inter-AS (EGP)</th></tr>
    <tr><td>Scope</td><td>Within one AS</td><td>Between different AS</td></tr>
    <tr><td>Protocol</td><td>RIP, OSPF, EIGRP</td><td>BGP</td></tr>
    <tr><td>Objective</td><td>Performance (shortest path)</td><td>Policy & business agreements</td></tr>
  </table></div>
</div>`,
  qa:[
    {q:"What is the count-to-infinity problem in Distance Vector routing?",a:"When a link fails, routers using DV may keep incrementing the metric (counting up to infinity) because they learn the bad route from each other in a loop. E.g., A thinks B can reach C in 2, B thinks A can reach C in 3, and so on. Fixed by split horizon or poison reverse."},
    {q:"How does OSPF differ from RIP?",a:"OSPF uses Link State Routing (Dijkstra's algorithm) while RIP uses Distance Vector (Bellman-Ford). OSPF floods topology info to ALL routers for a complete map; RIP shares routing tables only with neighbors. OSPF converges faster and supports larger networks. OSPF uses cost (bandwidth-based); RIP uses hop count (max 15)."},
    {q:"What is an Autonomous System?",a:"An Autonomous System (AS) is a collection of IP networks and routers under the control of one or more network operators that presents a common routing policy to the Internet. Each AS has a unique AS Number (ASN). BGP routes between AS."},
    {q:"Why does BGP use path vector instead of distance vector?",a:"BGP's path vector includes the full AS-PATH, which prevents routing loops (if your own ASN appears in the path, reject it). It also allows policy control — you can prefer or reject routes based on which ASes are in the path, which is critical for Internet business relationships."},
  ],
  quiz:[
    {q:"RIP uses which routing algorithm?",opts:["Dijkstra's SPF","Bellman-Ford","Floyd-Warshall","Prim's"],ans:1,exp:"RIP (Routing Information Protocol) uses the Bellman-Ford (Distance Vector) algorithm."},
    {q:"Maximum hop count in RIP is:",opts:["10","15","16","255"],ans:1,exp:"RIP maximum = 15 hops. 16 = infinity (unreachable). This limits RIP to small networks."},
    {q:"OSPF uses which algorithm to compute shortest paths?",opts:["Bellman-Ford","Prim's","Dijkstra's SPF","Kruskal's"],ans:2,exp:"OSPF uses Dijkstra's Shortest Path First (SPF) algorithm on its link-state database."},
    {q:"BGP uses which transport protocol?",opts:["UDP port 520","TCP port 179","UDP port 179","TCP port 80"],ans:1,exp:"BGP uses TCP port 179. Using TCP ensures reliable delivery of routing updates."},
    {q:"Which routing protocol is used BETWEEN autonomous systems?",opts:["RIP","OSPF","EIGRP","BGP"],ans:3,exp:"BGP (Border Gateway Protocol) is the inter-AS routing protocol of the Internet."},
    {q:"Split horizon prevents count-to-infinity by:",opts:["Advertising infinity to all","Not advertising route back through interface learned","Increasing TTL","Using MD5 authentication"],ans:1,exp:"Split horizon: never advertise a route back to the interface you learned it from, preventing loops."},
  ],
  flash:[
    {term:"Distance Vector",def:"Routing where each router shares its routing table with neighbors. Uses Bellman-Ford. Example: RIP. Slow convergence.",tag:"Routing"},
    {term:"Link State",def:"Routing where each router floods topology info to all routers. Uses Dijkstra. Example: OSPF. Fast convergence.",tag:"Routing"},
    {term:"BGP",def:"Border Gateway Protocol — path vector protocol used between Autonomous Systems on the Internet. Uses TCP:179.",tag:"Routing"},
    {term:"Count-to-Infinity",def:"DV problem where bad news propagates slowly as routers keep incrementing a failed route's metric. Fixed by split horizon.",tag:"Routing"},
    {term:"OSPF Area",def:"OSPF divides network into areas to limit LSA flooding. Area 0 = backbone. Reduces routing overhead.",tag:"Routing"},
    {term:"AS-PATH",def:"BGP attribute listing all AS numbers a route has passed through. Used for loop detection and policy.",tag:"Routing"},
  ]
},

multicast:{
  title:"Multicast Routing",
  tag:"UNIT III · Network Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Network Layer</div>
  <h1>Multicast Routing</h1>
  <p>Multicast sends packets from one source to a group of interested receivers — more efficient than unicast (multiple copies) or broadcast (to everyone).</p>
</div>
<div class="section-card">
  <h3>Multicast vs Unicast vs Broadcast</h3>
  <div class="table-wrap"><table>
    <tr><th>Type</th><th>Destination</th><th>Example</th></tr>
    <tr><td>Unicast</td><td>One specific host</td><td>HTTP, FTP</td></tr>
    <tr><td>Broadcast</td><td>All hosts in subnet</td><td>ARP, DHCP</td></tr>
    <tr><td>Multicast</td><td>Group of interested hosts</td><td>IPTV, video conferencing</td></tr>
    <tr><td>Anycast</td><td>Nearest of a group</td><td>DNS root servers</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>IGMP — Internet Group Management Protocol</h3>
  <p>IGMP manages multicast group membership between hosts and local routers.</p>
  <ul>
    <li><strong>Join:</strong> Host sends IGMP Membership Report to join a group (e.g., 224.1.2.3)</li>
    <li><strong>Leave:</strong> Host sends IGMP Leave Group message</li>
    <li><strong>Query:</strong> Router sends IGMP Membership Query to check if any hosts still in group</li>
  </ul>
  <div class="formula-box">
IGMPv1: Join + Query
IGMPv2: Added Leave Group message
IGMPv3: Source-specific multicast (SSM)
  </div>
</div>
<div class="section-card">
  <h3>Multicast Routing Protocols</h3>
  <ul>
    <li><strong>DVMRP (Distance Vector Multicast Routing Protocol):</strong> Uses RPM (Reverse Path Multicasting). Flood & prune approach.</li>
    <li><strong>PIM-DM (Dense Mode):</strong> Assumes all subnets want traffic; floods then prunes branches that don't want it.</li>
    <li><strong>PIM-SM (Sparse Mode):</strong> Only sends to subnets that explicitly request. Uses Rendezvous Point (RP). Suitable for large networks.</li>
    <li><strong>MOSPF:</strong> Extension of OSPF for multicast. Uses link-state database.</li>
  </ul>
</div>
<div class="section-card">
  <h3>Multicast Addressing</h3>
  <p>IPv4 multicast uses Class D addresses: <strong>224.0.0.0 – 239.255.255.255</strong></p>
  <div class="table-wrap"><table>
    <tr><th>Address</th><th>Purpose</th></tr>
    <tr><td>224.0.0.1</td><td>All hosts on local subnet</td></tr>
    <tr><td>224.0.0.2</td><td>All routers on local subnet</td></tr>
    <tr><td>224.0.0.5</td><td>All OSPF routers</td></tr>
    <tr><td>224.0.0.6</td><td>OSPF designated routers</td></tr>
  </table></div>
  <div class="highlight-box">💡 Multicast MAC: 01:00:5E:xx:xx:xx — lower 23 bits of IP multicast mapped to MAC.</div>
</div>`,
  qa:[
    {q:"What is the role of IGMP?",a:"IGMP (Internet Group Management Protocol) manages multicast group membership at the local network level. Hosts use IGMP to join/leave multicast groups; routers use it to track which groups have active members on each interface."},
    {q:"Explain PIM-SM vs PIM-DM.",a:"PIM-DM (Dense Mode) assumes all routers want multicast traffic — it floods traffic everywhere and then prunes branches with no receivers. PIM-SM (Sparse Mode) assumes few receivers — routers must explicitly join via a Rendezvous Point (RP). PIM-SM is preferred for large, sparse networks."},
    {q:"What IP address range is used for multicast?",a:"IPv4 multicast uses Class D addresses: 224.0.0.0 to 239.255.255.255. Link-local multicast is 224.0.0.0/24 (not forwarded by routers). Globally scoped multicast uses 224.0.1.0 to 238.255.255.255."},
  ],
  quiz:[
    {q:"Which IP address range is used for IPv4 multicast?",opts:["192.168.x.x","172.16.x.x","224.0.0.0–239.255.255.255","240.0.0.0–255.255.255.255"],ans:2,exp:"Class D (224.0.0.0–239.255.255.255) is reserved for multicast."},
    {q:"What protocol manages multicast group membership?",opts:["ARP","IGMP","OSPF","PIM"],ans:1,exp:"IGMP (Internet Group Management Protocol) manages group membership between hosts and local multicast routers."},
    {q:"PIM-SM uses what to concentrate multicast traffic?",opts:["Designated Router","Rendezvous Point","Bootstrap Router","Area Border Router"],ans:1,exp:"PIM Sparse Mode uses a Rendezvous Point (RP) — a meeting point where sources and receivers connect."},
    {q:"IGMP Leave Group message was added in:",opts:["IGMPv1","IGMPv2","IGMPv3","IGMPv4"],ans:1,exp:"IGMPv2 added the Leave Group message, allowing hosts to explicitly notify routers they are leaving."},
  ],
  flash:[
    {term:"Multicast",def:"One-to-many delivery to a group of interested receivers using Class D addresses (224.0.0.0–239.255.255.255).",tag:"Multicast"},
    {term:"IGMP",def:"Internet Group Management Protocol — manages multicast group membership between hosts and routers on local network.",tag:"Multicast"},
    {term:"PIM-SM",def:"Protocol Independent Multicast — Sparse Mode. Uses Rendezvous Point (RP). Efficient for large sparse networks.",tag:"Multicast"},
    {term:"Rendezvous Point",def:"Central router in PIM-SM where multicast sources register and receivers join. Traffic initially flows through RP.",tag:"Multicast"},
  ]
},

ipv6:{
  title:"IPv6 & ICMPv6",
  tag:"UNIT III · Network Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Network Layer</div>
  <h1>IPv6 & ICMPv6</h1>
  <p>IPv6 was designed to solve IPv4 address exhaustion. It uses 128-bit addresses, simplified headers, and built-in features like auto-configuration and IPsec.</p>
</div>
<div class="section-card">
  <h3>IPv6 Address Space</h3>
  <div class="formula-box">
IPv4: 32 bits → 4.3 billion addresses
IPv6: 128 bits → 3.4 × 10^38 addresses
Notation: 8 groups of 4 hex digits, colon-separated
Example: 2001:0db8:85a3:0000:0000:8a2e:0370:7334
Compressed: 2001:db8:85a3::8a2e:370:7334
  </div>
</div>
<div class="section-card">
  <h3>IPv6 Header (Fixed 40 bytes)</h3>
  <div class="formula-box">
Version(4) | Traffic Class(8) | Flow Label(20)
Payload Length(16) | Next Header(8) | Hop Limit(8)
Source Address (128 bits)
Destination Address (128 bits)
  </div>
  <div class="table-wrap"><table>
    <tr><th>IPv4 Field</th><th>IPv6 Equivalent</th></tr>
    <tr><td>TTL</td><td>Hop Limit</td></tr>
    <tr><td>Protocol</td><td>Next Header</td></tr>
    <tr><td>Header Checksum</td><td>Removed (done by L2/L4)</td></tr>
    <tr><td>Options</td><td>Extension Headers</td></tr>
    <tr><td>IHL (Header Length)</td><td>Fixed 40 bytes (removed)</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>IPv6 Address Types</h3>
  <div class="table-wrap"><table>
    <tr><th>Type</th><th>Prefix</th><th>Scope</th></tr>
    <tr><td>Global Unicast</td><td>2000::/3</td><td>Internet-routable</td></tr>
    <tr><td>Link-Local</td><td>FE80::/10</td><td>Same link only</td></tr>
    <tr><td>Unique Local</td><td>FC00::/7</td><td>Private (like RFC1918)</td></tr>
    <tr><td>Multicast</td><td>FF00::/8</td><td>Group delivery</td></tr>
    <tr><td>Loopback</td><td>::1/128</td><td>Same host</td></tr>
    <tr><td>Unspecified</td><td>::/128</td><td>Source before address assigned</td></tr>
  </table></div>
  <div class="highlight-box">💡 No broadcast in IPv6! It uses multicast instead. FF02::1 = all nodes, FF02::2 = all routers.</div>
</div>
<div class="section-card">
  <h3>IPv6 Features</h3>
  <ul>
    <li><strong>SLAAC:</strong> Stateless Address Auto-Configuration — devices generate their own address from prefix + MAC (EUI-64)</li>
    <li><strong>IPsec:</strong> Built-in mandatory support (optional in IPv4)</li>
    <li><strong>No NAT needed:</strong> Enough addresses for every device globally</li>
    <li><strong>No fragmentation by routers:</strong> Only source can fragment; routers use ICMPv6 to signal MTU issues</li>
    <li><strong>Flow Label:</strong> Identifies packet flows for QoS treatment</li>
  </ul>
</div>
<div class="section-card">
  <h3>ICMPv6</h3>
  <p>ICMPv6 is much more important than ICMPv4 — it handles functions previously done by ARP, IGMP, and ICMP.</p>
  <div class="table-wrap"><table>
    <tr><th>ICMPv6 Type</th><th>Message</th><th>Function</th></tr>
    <tr><td>1</td><td>Destination Unreachable</td><td>Same as ICMPv4</td></tr>
    <tr><td>2</td><td>Packet Too Big</td><td>Replaces fragmentation needed</td></tr>
    <tr><td>3</td><td>Time Exceeded</td><td>Hop limit exceeded</td></tr>
    <tr><td>128/129</td><td>Echo Request/Reply</td><td>Ping</td></tr>
    <tr><td>133</td><td>Router Solicitation</td><td>Host asks for router</td></tr>
    <tr><td>134</td><td>Router Advertisement</td><td>Router sends prefix info</td></tr>
    <tr><td>135</td><td>Neighbor Solicitation</td><td>Replaces ARP Request</td></tr>
    <tr><td>136</td><td>Neighbor Advertisement</td><td>Replaces ARP Reply</td></tr>
  </table></div>
  <div class="highlight-box">💡 NDP (Neighbor Discovery Protocol) = Types 133–137. It replaces ARP entirely in IPv6.</div>
</div>`,
  qa:[
    {q:"How many addresses does IPv6 provide?",a:"IPv6 uses 128-bit addresses, providing 2^128 = approximately 3.4 × 10^38 addresses — enough to assign millions of addresses to every atom on Earth's surface."},
    {q:"What replaced ARP in IPv6?",a:"NDP (Neighbor Discovery Protocol), part of ICMPv6, replaces ARP. Neighbor Solicitation (Type 135) replaces ARP Request, and Neighbor Advertisement (Type 136) replaces ARP Reply. NDP uses multicast instead of broadcast."},
    {q:"What is SLAAC?",a:"SLAAC (Stateless Address Auto-Configuration) allows IPv6 devices to automatically configure their own address without a DHCP server. The host uses the network prefix from Router Advertisements and generates the host portion from its MAC address using EUI-64 format."},
    {q:"What key improvements does IPv6 have over IPv4?",a:"1) 128-bit addresses (virtually unlimited), 2) Fixed 40-byte header (faster processing), 3) No router fragmentation (handled at source), 4) No broadcast (uses multicast), 5) Built-in IPsec, 6) SLAAC for auto-configuration, 7) Flow Label for QoS, 8) No header checksum (reduces router overhead)."},
  ],
  quiz:[
    {q:"IPv6 address is how many bits?",opts:["32","64","128","256"],ans:2,exp:"IPv6 uses 128-bit addresses, providing 3.4×10^38 addresses."},
    {q:"Which ICMPv6 type replaces ARP Request?",opts:["Router Solicitation (133)","Neighbor Solicitation (135)","Neighbor Advertisement (136)","Router Advertisement (134)"],ans:1,exp:"ICMPv6 Type 135 = Neighbor Solicitation, which replaces IPv4 ARP Request."},
    {q:"IPv6 link-local addresses use prefix:",opts:["FE80::/10","FC00::/7","FF00::/8","2000::/3"],ans:0,exp:"Link-local addresses (FE80::/10) are auto-configured on every IPv6 interface, used for local link communication only."},
    {q:"What field in IPv6 header replaced IPv4's TTL?",opts:["Flow Label","Traffic Class","Hop Limit","Next Header"],ans:2,exp:"Hop Limit in IPv6 serves the same purpose as TTL in IPv4 — decremented at each router."},
    {q:"IPv6 does NOT support:",opts:["Multicast","Anycast","Broadcast","Unicast"],ans:2,exp:"IPv6 has no broadcast. It uses multicast addresses (FF02::1 for all nodes) instead of broadcast."},
  ],
  flash:[
    {term:"IPv6",def:"128-bit addressing protocol with 3.4×10^38 addresses. Fixed 40-byte header, no broadcast, built-in IPsec.",tag:"IPv6"},
    {term:"NDP",def:"Neighbor Discovery Protocol (ICMPv6 Types 133-137) — replaces ARP, enables router discovery and SLAAC.",tag:"IPv6"},
    {term:"SLAAC",def:"Stateless Address Auto-Configuration — IPv6 devices auto-generate addresses from prefix + MAC (EUI-64). No DHCP needed.",tag:"IPv6"},
    {term:"Link-Local",def:"IPv6 addresses starting with FE80::/10. Auto-configured, only usable on the local link, never routed.",tag:"IPv6"},
    {term:"Flow Label",def:"20-bit IPv6 header field identifying a flow of packets requiring special QoS treatment.",tag:"IPv6"},
    {term:"ICMPv6 Type 2",def:"Packet Too Big — sent when router cannot forward packet due to MTU. Source uses this for Path MTU Discovery.",tag:"IPv6"},
  ]
},

applayer:{
  title:"Application Layer",
  tag:"UNIT III · Application Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Application Layer</div>
  <h1>Application Layer</h1>
  <p>The application layer is the topmost layer (Layer 7) in the OSI model. It provides network services directly to end-users through application programs.</p>
</div>
<div class="section-card">
  <h3>Application Layer Paradigm</h3>
  <p>Two main paradigms for distributed applications:</p>
  <div class="table-wrap"><table>
    <tr><th>Paradigm</th><th>Model</th><th>Examples</th></tr>
    <tr><td>Client-Server</td><td>Always-on server, clients initiate</td><td>HTTP, FTP, SMTP, DNS</td></tr>
    <tr><td>Peer-to-Peer (P2P)</td><td>Peers communicate directly</td><td>BitTorrent, Skype (early)</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Standard Application Layer Protocols</h3>
  <div class="table-wrap"><table>
    <tr><th>Protocol</th><th>Port</th><th>Transport</th><th>Function</th></tr>
    <tr><td>HTTP</td><td>80</td><td>TCP</td><td>Web browsing</td></tr>
    <tr><td>HTTPS</td><td>443</td><td>TCP</td><td>Secure web</td></tr>
    <tr><td>FTP</td><td>20/21</td><td>TCP</td><td>File transfer</td></tr>
    <tr><td>SMTP</td><td>25</td><td>TCP</td><td>Send email</td></tr>
    <tr><td>POP3</td><td>110</td><td>TCP</td><td>Receive email (download)</td></tr>
    <tr><td>IMAP</td><td>143</td><td>TCP</td><td>Receive email (server-side)</td></tr>
    <tr><td>DNS</td><td>53</td><td>UDP/TCP</td><td>Name resolution</td></tr>
    <tr><td>DHCP</td><td>67/68</td><td>UDP</td><td>IP address assignment</td></tr>
    <tr><td>SSH</td><td>22</td><td>TCP</td><td>Secure shell</td></tr>
    <tr><td>Telnet</td><td>23</td><td>TCP</td><td>Remote terminal</td></tr>
    <tr><td>SNMP</td><td>161</td><td>UDP</td><td>Network management</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>HTTP — Hypertext Transfer Protocol</h3>
  <ul>
    <li>Stateless protocol (each request independent)</li>
    <li><strong>HTTP/1.0:</strong> Non-persistent — new TCP connection per object</li>
    <li><strong>HTTP/1.1:</strong> Persistent connections + pipelining</li>
    <li><strong>HTTP/2:</strong> Multiplexing, header compression, server push</li>
    <li><strong>HTTP Methods:</strong> GET, POST, PUT, DELETE, HEAD, OPTIONS</li>
    <li><strong>Status Codes:</strong> 2xx (success), 3xx (redirect), 4xx (client error), 5xx (server error)</li>
  </ul>
  <div class="formula-box">
RTT = Round Trip Time
Non-persistent HTTP: 2RTT + file transmission time (per object)
Persistent HTTP: 1RTT for all objects after initial connection
  </div>
</div>
<div class="section-card">
  <h3>DNS — Domain Name System</h3>
  <p>DNS translates human-readable domain names (www.google.com) to IP addresses. It is a distributed, hierarchical database.</p>
  <ul>
    <li><strong>Root servers:</strong> 13 sets worldwide (a.root-servers.net – m.root-servers.net)</li>
    <li><strong>TLD servers:</strong> .com, .org, .in, etc.</li>
    <li><strong>Authoritative servers:</strong> Hold actual DNS records for domains</li>
    <li><strong>Local DNS:</strong> Your ISP's resolver (cache)</li>
  </ul>
  <div class="table-wrap"><table>
    <tr><th>Record Type</th><th>Meaning</th></tr>
    <tr><td>A</td><td>Domain → IPv4 address</td></tr>
    <tr><td>AAAA</td><td>Domain → IPv6 address</td></tr>
    <tr><td>MX</td><td>Mail exchange server</td></tr>
    <tr><td>CNAME</td><td>Alias to another domain</td></tr>
    <tr><td>NS</td><td>Name server for zone</td></tr>
    <tr><td>PTR</td><td>Reverse lookup (IP → domain)</td></tr>
  </table></div>
</div>`,
  qa:[
    {q:"What is the difference between HTTP/1.0 and HTTP/1.1?",a:"HTTP/1.0 uses non-persistent connections — a new TCP connection is made for each object. HTTP/1.1 introduced persistent connections (reuse same TCP connection) and pipelining (send multiple requests without waiting for responses), significantly reducing RTT overhead."},
    {q:"How does DNS resolution work? (Iterative vs Recursive)",a:"Iterative: Local DNS asks root → root returns TLD server address → local asks TLD → TLD returns authoritative server → local asks authoritative → gets IP. Recursive: Local DNS queries root, and each server queries the next on behalf of the client. Most real implementations use iterative from local resolver."},
    {q:"What is the difference between POP3 and IMAP?",a:"POP3 downloads emails to the client and typically deletes from server (offline mode). IMAP keeps emails on the server and syncs state — you can access email from multiple devices with consistent state. IMAP supports server-side folders and is preferred today."},
  ],
  quiz:[
    {q:"Which port does DNS use?",opts:["25","53","80","110"],ans:1,exp:"DNS uses port 53. It uses UDP for queries (fast) and TCP for zone transfers or large responses."},
    {q:"HTTP is:",opts:["Stateful","Connection-oriented","Stateless","Reliable itself"],ans:2,exp:"HTTP is stateless — the server doesn't retain information about previous client requests. Sessions are managed via cookies."},
    {q:"FTP uses which ports?",opts:["20 and 21","25 and 110","80 and 443","22 and 23"],ans:0,exp:"FTP: Port 21 for control connection, Port 20 for data transfer (in active mode)."},
    {q:"Which DNS record maps domain to IPv6 address?",opts:["A","MX","AAAA","PTR"],ans:2,exp:"AAAA record maps a domain name to an IPv6 address. A record maps to IPv4."},
    {q:"HTTP status code 404 means:",opts:["Server error","Unauthorized","Not Found","Redirect"],ans:2,exp:"404 = Not Found. The requested resource doesn't exist on the server."},
  ],
  flash:[
    {term:"HTTP",def:"Hypertext Transfer Protocol — stateless, TCP-based protocol for web. Port 80 (HTTP), 443 (HTTPS).",tag:"Application Layer"},
    {term:"DNS",def:"Domain Name System — hierarchical distributed database mapping domain names to IP addresses. Port 53 (UDP/TCP).",tag:"Application Layer"},
    {term:"SMTP",def:"Simple Mail Transfer Protocol — used to SEND email. Port 25. Uses TCP. Push protocol.",tag:"Application Layer"},
    {term:"IMAP vs POP3",def:"IMAP (143): server-side email management, multi-device sync. POP3 (110): downloads and deletes email from server.",tag:"Application Layer"},
    {term:"Persistent HTTP",def:"HTTP/1.1 feature — reuses same TCP connection for multiple requests, reducing RTT overhead.",tag:"Application Layer"},
    {term:"A Record",def:"DNS record type mapping a hostname to an IPv4 address. AAAA = IPv6, MX = mail, CNAME = alias.",tag:"Application Layer"},
  ]
},

clientserver:{
  title:"Client-Server & P2P",
  tag:"UNIT III · Application Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Application Layer</div>
  <h1>Client-Server & P2P Paradigms</h1>
  <p>Two fundamental architectures for distributed application design.</p>
</div>
<div class="section-card">
  <h3>Client-Server Architecture</h3>
  <ul>
    <li><strong>Server:</strong> Always-on host with permanent IP. Serves requests from clients. Can be scaled using data centers.</li>
    <li><strong>Client:</strong> Communicates with server, may have dynamic IP, does NOT communicate with other clients directly.</li>
    <li>Examples: Web (HTTP), Email (SMTP/IMAP), DNS, FTP</li>
  </ul>
  <div class="highlight-box">Scalability challenge: A single server can become a bottleneck. CDNs and load balancers address this.</div>
  <div class="formula-box">
Distribution time (C-S model):
D_cs = max{ NF/u_s, F/d_min }
N = clients, F = file size, u_s = server upload, d_min = min client download
  </div>
</div>
<div class="section-card">
  <h3>P2P Architecture</h3>
  <ul>
    <li>No always-on server — peers communicate directly</li>
    <li>Each peer is both client and server</li>
    <li>Self-scalable: more peers = more upload capacity</li>
    <li>Challenges: Security, reliability, finding peers</li>
  </ul>
  <div class="formula-box">
Distribution time (P2P):
D_P2P = max{ F/u_s, F/d_min, NF/(u_s + Σu_i) }
More peers → denominator grows → faster!
  </div>
</div>
<div class="section-card">
  <h3>BitTorrent</h3>
  <p>Most popular P2P file-sharing protocol:</p>
  <ul>
    <li>File divided into 256KB chunks</li>
    <li><strong>Tracker:</strong> Keeps list of peers in torrent</li>
    <li><strong>Torrent:</strong> Group of peers exchanging chunks</li>
    <li><strong>Rarest First:</strong> Request rarest chunk first</li>
    <li><strong>Tit-for-Tat:</strong> Upload to peers who send you data fastest (incentive mechanism)</li>
    <li><strong>Optimistic Unchoking:</strong> Randomly upload to one choked peer (discover better partners)</li>
  </ul>
</div>
<div class="section-card">
  <h3>DHT — Distributed Hash Table</h3>
  <p>Decentralized peer lookup system (no central tracker):</p>
  <ul>
    <li>Each peer responsible for a range of keys</li>
    <li>Key = hash(content), Value = peer with that content</li>
    <li>Lookup: O(log N) hops in Chord/Kademlia</li>
    <li>Examples: Kademlia (used in BitTorrent), Chord</li>
  </ul>
</div>`,
  qa:[
    {q:"Why is P2P self-scalable but C-S is not?",a:"In C-S, adding more clients increases load on the server (fixed upload capacity). In P2P, each new peer brings its own upload bandwidth, increasing the system's total capacity. So P2P distribution time grows much slower with the number of peers."},
    {q:"What is BitTorrent's tit-for-tat mechanism?",a:"BitTorrent uploads to the 4 peers that are sending you data at the highest rate (unchoked). Every 30 seconds, one randomly chosen choked peer is 'optimistically unchoked' to discover potentially better partners. This incentivizes peers to share (if you don't upload, you won't receive)."},
    {q:"What problem does DHT solve in P2P?",a:"DHT (Distributed Hash Table) eliminates the need for a central tracker. In systems like Kademlia, keys (content hashes) are mapped to peers using consistent hashing. Any peer can locate content in O(log N) lookups, making the system fully decentralized and resilient to failures."},
  ],
  quiz:[
    {q:"In BitTorrent, which chunk is requested first?",opts:["Largest chunk","Rarest chunk","First chunk","Random chunk"],ans:1,exp:"BitTorrent's 'rarest-first' strategy requests the least-common chunk to improve distribution uniformity."},
    {q:"In P2P, as more peers join, distribution time:",opts:["Increases","Stays the same","Decreases","Becomes unpredictable"],ans:2,exp:"P2P is self-scalable. More peers = more upload capacity, so distribution time decreases or grows very slowly."},
    {q:"BitTorrent's incentive mechanism is called:",opts:["Rarest first","DHT","Tit-for-tat","Optimistic seeding"],ans:2,exp:"Tit-for-Tat: BitTorrent uploads to peers that upload to you at the highest rate, incentivizing sharing."},
    {q:"A BitTorrent Tracker:",opts:["Stores file chunks","Provides peer lists for a torrent","Acts as CDN","Encrypts data"],ans:1,exp:"The tracker keeps track of which peers are in a torrent and helps new peers find others to connect with."},
  ],
  flash:[
    {term:"P2P",def:"Peer-to-Peer — no central server; each peer acts as both client and server. Self-scalable architecture.",tag:"P2P"},
    {term:"BitTorrent",def:"P2P file sharing protocol. File split into 256KB chunks. Uses rarest-first, tit-for-tat, and tracker/DHT.",tag:"P2P"},
    {term:"DHT",def:"Distributed Hash Table — decentralized peer lookup (no tracker). Maps content hash to responsible peer. O(log N) lookup.",tag:"P2P"},
    {term:"Tit-for-Tat",def:"BitTorrent incentive: upload to the 4 peers sending you data fastest. Prevents free-riding.",tag:"P2P"},
    {term:"CDN",def:"Content Delivery Network — geographically distributed servers caching content near users to reduce latency.",tag:"Client-Server"},
  ]
},

socket:{
  title:"Socket Programming",
  tag:"UNIT III · Application Layer",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT III · Application Layer</div>
  <h1>Socket Programming</h1>
  <p>Sockets are the API between the application layer and transport layer. They are identified by IP address + port number.</p>
</div>
<div class="section-card">
  <h3>Socket Basics</h3>
  <ul>
    <li>A socket is a door between the application process and transport protocol</li>
    <li>Identified by: (IP address, Port number, Protocol)</li>
    <li><strong>TCP Socket:</strong> Connection-oriented, reliable, stream-based</li>
    <li><strong>UDP Socket:</strong> Connectionless, unreliable, datagram-based</li>
  </ul>
  <div class="formula-box">
Socket = (Source IP, Source Port, Dest IP, Dest Port, Protocol)
This 5-tuple uniquely identifies a connection
  </div>
</div>
<div class="section-card">
  <h3>TCP Socket Programming — Server</h3>
  <div class="formula-box">
1. socket()     → Create socket (SOCK_STREAM for TCP)
2. bind()       → Bind to IP:port
3. listen()     → Mark socket as passive (accepting)
4. accept()     → Block until client connects → returns new socket
5. recv()/send()→ Data transfer on new socket
6. close()      → Close connection
  </div>
</div>
<div class="section-card">
  <h3>TCP Socket Programming — Client</h3>
  <div class="formula-box">
1. socket()     → Create socket
2. connect()    → Connect to server IP:port (3-way handshake happens)
3. send()/recv()→ Data transfer
4. close()      → Close connection
  </div>
  <div class="highlight-box">💡 TCP: connect() triggers the 3-way handshake. accept() returns a new dedicated socket for that client — the original listening socket remains open for new connections.</div>
</div>
<div class="section-card">
  <h3>UDP Socket Programming</h3>
  <div class="formula-box">
Server:
1. socket()      → SOCK_DGRAM
2. bind()        → Bind to port
3. recvfrom()    → Receive datagram + sender address
4. sendto()      → Send reply to sender

Client:
1. socket()      → SOCK_DGRAM
2. sendto()      → Send to server IP:port
3. recvfrom()    → Receive reply
  </div>
  <div class="warn-box">⚠️ UDP has no connect()/accept(). Each datagram is independent. No handshake. Must include destination in sendto().</div>
</div>
<div class="section-card">
  <h3>Key Differences: TCP vs UDP Sockets</h3>
  <div class="table-wrap"><table>
    <tr><th>Feature</th><th>TCP (SOCK_STREAM)</th><th>UDP (SOCK_DGRAM)</th></tr>
    <tr><td>Connection</td><td>Required (connect/accept)</td><td>Not required</td></tr>
    <tr><td>Reliability</td><td>Guaranteed delivery</td><td>Best-effort</td></tr>
    <tr><td>API calls</td><td>send/recv</td><td>sendto/recvfrom</td></tr>
    <tr><td>Message boundaries</td><td>Stream (no boundaries)</td><td>Preserved (datagrams)</td></tr>
    <tr><td>Use case</td><td>HTTP, FTP, SSH</td><td>DNS, DHCP, streaming</td></tr>
  </table></div>
</div>`,
  qa:[
    {q:"What is a socket? How is it identified?",a:"A socket is the interface between an application and the transport layer. It is uniquely identified by a 5-tuple: (Source IP, Source Port, Destination IP, Destination Port, Protocol). This 5-tuple is what distinguishes multiple connections on the same server port."},
    {q:"Explain the TCP server socket sequence.",a:"1. socket() — create socket, 2. bind() — assign IP:port, 3. listen() — mark as passive/accepting, 4. accept() — block until client connects (returns new socket per client), 5. recv()/send() — data exchange on the per-client socket, 6. close() — close both sockets."},
    {q:"Why does TCP use two sockets (welcoming + connection socket)?",a:"The welcoming socket (listening socket) stays bound to the server port and waits for new clients. When a client connects, accept() creates a new dedicated socket for that client's session. This allows the server to handle multiple clients simultaneously while still accepting new connections on the original port."},
    {q:"Why does UDP use sendto/recvfrom instead of send/recv?",a:"UDP is connectionless — there is no established connection, so each call must specify the destination (sendto) or return the source (recvfrom). With TCP, the connection is established once and send/recv implicitly know the other endpoint."},
  ],
  quiz:[
    {q:"Which system call creates a new socket per client in TCP server?",opts:["bind()","listen()","accept()","connect()"],ans:2,exp:"accept() blocks until a client connects, then returns a new socket dedicated to that client's connection."},
    {q:"UDP sockets use which socket type?",opts:["SOCK_STREAM","SOCK_DGRAM","SOCK_RAW","SOCK_SEQPACKET"],ans:1,exp:"SOCK_DGRAM is for UDP (datagram). SOCK_STREAM is for TCP."},
    {q:"Which call initiates the TCP 3-way handshake on the client side?",opts:["socket()","bind()","listen()","connect()"],ans:3,exp:"connect() on the client initiates the 3-way handshake with the server."},
    {q:"UDP's recvfrom() returns:",opts:["Only data","Data + sender's address","Connection object","Error code only"],ans:1,exp:"recvfrom() returns the data AND the sender's (IP, port) — needed since UDP has no connection state."},
  ],
  flash:[
    {term:"Socket",def:"API between application and transport layer. Identified by 5-tuple: (src IP, src port, dst IP, dst port, protocol).",tag:"Sockets"},
    {term:"accept()",def:"TCP server call that blocks until client connects. Returns NEW socket dedicated to that client.",tag:"Sockets"},
    {term:"bind()",def:"Associates a socket with a specific local IP address and port number.",tag:"Sockets"},
    {term:"SOCK_STREAM",def:"Socket type for TCP — reliable, connection-oriented, byte-stream delivery.",tag:"Sockets"},
    {term:"SOCK_DGRAM",def:"Socket type for UDP — unreliable, connectionless, datagram-based.",tag:"Sockets"},
    {term:"sendto/recvfrom",def:"UDP socket calls — must include destination/source address with each call since no connection exists.",tag:"Sockets"},
  ]
},

multimedia:{
  title:"Multimedia & QoS",
  tag:"UNIT IV · Multimedia",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT IV · Multimedia & QoS</div>
  <h1>Multimedia & Quality of Service</h1>
  <p>Multimedia applications (audio/video) have unique requirements — they are delay-sensitive but can tolerate some loss. QoS mechanisms ensure the network meets these requirements.</p>
</div>
<div class="section-card">
  <h3>Multimedia Data Types</h3>
  <div class="table-wrap"><table>
    <tr><th>Type</th><th>Characteristic</th><th>Sensitivity</th></tr>
    <tr><td>Stored Audio/Video</td><td>Pre-recorded, buffered</td><td>Tolerates delay variation</td></tr>
    <tr><td>Live Audio/Video</td><td>Streamed in real-time</td><td>Low delay needed</td></tr>
    <tr><td>Interactive (VoIP)</td><td>Two-way real-time</td><td>Very low delay (<150ms)</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>Streaming Stored Audio/Video</h3>
  <ul>
    <li><strong>Buffering:</strong> Client buffers data (few seconds) before playback to absorb network jitter</li>
    <li><strong>Prefetching:</strong> Download faster than playback rate when possible</li>
    <li><strong>Progressive Download:</strong> Start playing while still downloading</li>
    <li><strong>DASH:</strong> Dynamic Adaptive Streaming over HTTP — client selects quality based on bandwidth</li>
  </ul>
</div>
<div class="section-card">
  <h3>Real-Time Protocols</h3>
  <div class="table-wrap"><table>
    <tr><th>Protocol</th><th>Port</th><th>Function</th></tr>
    <tr><td>RTP</td><td>Even UDP ports</td><td>Real-time data transport (sequence, timestamp)</td></tr>
    <tr><td>RTCP</td><td>RTP port + 1</td><td>Control/feedback (loss rate, jitter)</td></tr>
    <tr><td>RTSP</td><td>554</td><td>Session control (play, pause, stop)</td></tr>
    <tr><td>SIP</td><td>5060/5061</td><td>VoIP session setup/teardown</td></tr>
    <tr><td>H.323</td><td>1720</td><td>VoIP/videoconferencing standard</td></tr>
  </table></div>
  <div class="formula-box">
RTP Header:
Version(2) | P(1) | X(1) | CC(4) | M(1) | PT(7) | Sequence Number(16)
Timestamp(32)
SSRC — Synchronization Source Identifier(32)
  </div>
  <div class="highlight-box">💡 RTP provides sequence numbers + timestamps. Sequence detects loss; timestamps enable jitter removal and synchronization. RTP runs OVER UDP.</div>
</div>
<div class="section-card">
  <h3>Quality of Service (QoS)</h3>
  <p>QoS guarantees that certain flows get required bandwidth, delay, and loss rates.</p>
  <div class="table-wrap"><table>
    <tr><th>QoS Mechanism</th><th>Description</th></tr>
    <tr><td>Traffic Shaping</td><td>Regulate packet rate (Token Bucket, Leaky Bucket)</td></tr>
    <tr><td>Scheduling</td><td>Prioritize packets (WFQ, Priority Queuing)</td></tr>
    <tr><td>Admission Control</td><td>Reject new flows if resources unavailable</td></tr>
    <tr><td>DiffServ</td><td>Mark packets by class (DSCP bits in IP header)</td></tr>
    <tr><td>IntServ / RSVP</td><td>Reserve resources per-flow (resource reservation)</td></tr>
  </table></div>
  <div class="formula-box">
Leaky Bucket: Output at constant rate r regardless of burst
Token Bucket: Allow bursts up to bucket size b, sustained rate r
Output: min(burst, token_bucket_capacity)
  </div>
</div>
<div class="section-card">
  <h3>Jitter and Playout Buffer</h3>
  <p>Jitter = variation in packet arrival delay. Caused by queuing at routers.</p>
  <ul>
    <li><strong>Fixed playout delay:</strong> Play packet at time p + d (d = fixed delay). Simple but can't adapt.</li>
    <li><strong>Adaptive playout delay:</strong> Estimate delay and jitter; adjust playout delay dynamically. Silence suppression detects pauses.</li>
  </ul>
  <div class="formula-box">
Estimated delay: d_i = (1-α)·d_{i-1} + α·(r_i - s_i)
Jitter estimate: v_i = (1-β)·v_{i-1} + β·|d_i - d_{i-1}|
Playout time: p_i = s_i + d_i + K·v_i
  </div>
</div>`,
  qa:[
    {q:"What is jitter and how is it handled in VoIP?",a:"Jitter is the variation in packet arrival delay caused by different queuing times at routers. In VoIP, it is handled by a playout buffer (jitter buffer) that delays playback slightly to absorb jitter. Adaptive algorithms estimate jitter and adjust the playout delay dynamically."},
    {q:"What does RTP provide that UDP doesn't?",a:"RTP adds sequence numbers (to detect out-of-order delivery and loss), timestamps (for synchronization and jitter removal), SSRC (to identify the source in mixers), and payload type (codec identification). UDP provides raw fast delivery but none of these multimedia-specific features."},
    {q:"Difference between Leaky Bucket and Token Bucket.",a:"Leaky Bucket outputs at a constant rate regardless of input burst — smooths traffic. Token Bucket allows bursting up to the bucket size 'b' while sustaining long-term rate 'r'. Token bucket is more flexible — it permits short bursts which is useful for multimedia applications."},
    {q:"What is RSVP and which QoS model does it support?",a:"RSVP (Resource ReSerVation Protocol) is used with the IntServ (Integrated Services) model. Applications signal their QoS requirements, and routers reserve resources (bandwidth, buffers) along the path per-flow. Receivers initiate RSVP PATH and RESV messages. Not scalable for the Internet's core."},
  ],
  quiz:[
    {q:"RTP provides sequence numbers primarily for:",opts:["Encryption","Detecting lost/out-of-order packets","Routing","Flow control"],ans:1,exp:"RTP sequence numbers let the receiver detect lost packets and reorder out-of-order packets."},
    {q:"RTCP is sent on:",opts:["Same port as RTP","RTP port + 1","Port 554","Port 1720"],ans:1,exp:"RTCP uses the next odd port after the RTP port (RTP port + 1)."},
    {q:"Which QoS mechanism uses DSCP bits in the IP header?",opts:["IntServ","DiffServ","RSVP","Token Bucket"],ans:1,exp:"DiffServ uses the DSCP (Differentiated Services Code Point) field in the IP header to mark packet priority class."},
    {q:"Token Bucket differs from Leaky Bucket in that it:",opts:["Outputs at constant rate","Allows controlled bursts","Drops excess packets","Uses FIFO queuing"],ans:1,exp:"Token Bucket allows bursts (up to bucket size b) while controlling the average rate r."},
    {q:"For interactive VoIP, maximum acceptable end-to-end delay is:",opts:["500ms","400ms","150ms","1 second"],ans:2,exp:"ITU G.114 recommends maximum 150ms one-way delay for interactive voice quality."},
  ],
  flash:[
    {term:"RTP",def:"Real-time Transport Protocol — runs over UDP, adds sequence numbers, timestamps, and SSRC for multimedia delivery.",tag:"Multimedia"},
    {term:"RTCP",def:"RTP Control Protocol — carries QoS feedback (loss rate, jitter, delay) on RTP port + 1.",tag:"Multimedia"},
    {term:"Jitter",def:"Variation in packet arrival delay due to different queuing at routers. Handled by playout buffer in receivers.",tag:"Multimedia"},
    {term:"DiffServ",def:"Differentiated Services — marks packets with DSCP bits for per-hop behavior. Scalable, no per-flow state.",tag:"QoS"},
    {term:"Token Bucket",def:"Traffic shaper that allows bursts up to size 'b' while sustaining long-term rate 'r'. More flexible than leaky bucket.",tag:"QoS"},
    {term:"DASH",def:"Dynamic Adaptive Streaming over HTTP — client selects video quality chunk-by-chunk based on available bandwidth.",tag:"Multimedia"},
    {term:"SIP",def:"Session Initiation Protocol — application-layer protocol for setting up, modifying, and tearing down VoIP/video sessions.",tag:"Multimedia"},
  ]
},

netmgmt:{
  title:"Network Management",
  tag:"UNIT IV · Network Management",
  learn:`
<div class="topic-header">
  <div class="topic-tag">UNIT IV · Network Management</div>
  <h1>Network Management — SNMP & ASN.1</h1>
  <p>Network management monitors and controls network infrastructure. SNMP is the standard protocol for this purpose.</p>
</div>
<div class="section-card">
  <h3>Network Management Framework</h3>
  <p>Five functional areas (FCAPS model):</p>
  <ul>
    <li><strong>Fault Management:</strong> Detect, isolate, correct faults</li>
    <li><strong>Configuration Management:</strong> Monitor/control network configuration</li>
    <li><strong>Accounting Management:</strong> Track resource usage and billing</li>
    <li><strong>Performance Management:</strong> Measure and optimize performance</li>
    <li><strong>Security Management:</strong> Control access and maintain security</li>
  </ul>
</div>
<div class="section-card">
  <h3>SNMP — Simple Network Management Protocol</h3>
  <p>SNMP is the standard Internet protocol for network management. It runs over <strong>UDP port 161</strong> (agent) and <strong>162</strong> (trap).</p>
  <div class="table-wrap"><table>
    <tr><th>Component</th><th>Role</th></tr>
    <tr><td>Manager</td><td>NMS (Network Management Station) — sends requests</td></tr>
    <tr><td>Agent</td><td>Software on managed device — responds to manager</td></tr>
    <tr><td>MIB</td><td>Management Information Base — database of manageable objects</td></tr>
  </table></div>
  <div class="table-wrap"><table>
    <tr><th>SNMP Operation</th><th>Description</th></tr>
    <tr><td>GetRequest</td><td>Manager requests specific MIB value from agent</td></tr>
    <tr><td>GetNextRequest</td><td>Manager traverses MIB table (next OID)</td></tr>
    <tr><td>GetBulkRequest</td><td>SNMPv2 — retrieve multiple values efficiently</td></tr>
    <tr><td>SetRequest</td><td>Manager sets a MIB variable (configure device)</td></tr>
    <tr><td>Response</td><td>Agent replies with requested value</td></tr>
    <tr><td>Trap</td><td>Agent proactively notifies manager of event (unsolicited)</td></tr>
    <tr><td>Inform</td><td>SNMPv2 — acknowledged Trap (manager sends ACK)</td></tr>
  </table></div>
</div>
<div class="section-card">
  <h3>SNMP Versions</h3>
  <div class="table-wrap"><table>
    <tr><th>Version</th><th>Security</th><th>Key Addition</th></tr>
    <tr><td>SNMPv1</td><td>Community string (plaintext)</td><td>Basic operations</td></tr>
    <tr><td>SNMPv2c</td><td>Community string</td><td>GetBulk, Inform, 64-bit counters</td></tr>
    <tr><td>SNMPv3</td><td>USM (authentication + encryption)</td><td>Security, access control (VACM)</td></tr>
  </table></div>
  <div class="warn-box">⚠️ SNMPv1 and v2c transmit community strings in plaintext — major security weakness. SNMPv3 adds MD5/SHA authentication and DES/AES encryption.</div>
</div>
<div class="section-card">
  <h3>MIB & ASN.1</h3>
  <ul>
    <li><strong>MIB (Management Information Base):</strong> Collection of managed objects organized in a tree hierarchy. Each object has a unique OID (Object Identifier).</li>
    <li><strong>OID Example:</strong> 1.3.6.1.2.1.1.1 = sysDescr (system description)</li>
    <li><strong>ASN.1 (Abstract Syntax Notation One):</strong> Language used to define MIB objects and SNMP messages. Platform-independent data description language.</li>
    <li><strong>BER (Basic Encoding Rules):</strong> Encoding scheme that converts ASN.1 structures to bytes for transmission.</li>
  </ul>
  <div class="highlight-box">💡 MIB-II is the standard MIB for TCP/IP networks (RFC 1213). It contains objects like ifTable (interfaces), ipAddrTable, tcpConnTable.</div>
</div>`,
  qa:[
